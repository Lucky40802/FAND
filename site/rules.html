  let total=0,unsold=false;const missing=[];
  const rows=b.mats.map(n=>{
    const m=findMat(n),need=q,h=have(n),miss=Math.max(0,need-h);if(miss)missing.push([n,miss]);
    const unit=m&&m.price||0;total+=unit*miss;if(m&&!m.price)unsold=true;
    const mons=m?(monByMat().get(lc(m.n))||[]).slice(0,3):[];
    const src=m?[mons.length?'Drops from '+mons.map(x=>refChip(x,esc(x.n),x.realm+' '+x.g)).join(' '):'',m.where?'Gathered at '+esc(m.where)+(m.by?' ('+esc(m.by)+')':''):'',m.price?'Sold by merchants':'Not sold'].filter(Boolean).join('<br>'):'Not in the materials list';
    const refine=m&&m.g>1?`${fmt(Math.pow(3,m.g-1)*need)} × ${esc(m.realm)} grade 1`:'';
    return `<tr><td>${m?refChip(m):esc(n)}${m&&m.tr?`<div style="font-size:.75rem;color:var(--gold2)">◆ ${esc(m.tr.n)}</div>`:''}</td><td>${m?esc(m.gr):''}</td><td class="num">${need}</td>${who?`<td class="num" style="color:${h>=need?'var(--green)':'var(--red)'}">${h}</td>`:''}<td class="num">${unit?gp(unit):'—'}</td><td class="num">${unit&&miss?gp(unit*miss):'—'}</td><td style="font-size:.8rem;color:var(--text2)">${src}</td><td style="font-size:.78rem;color:var(--muted)">${refine?'or refine from '+refine:''}</td></tr>`;
  }).join('');
  const prof=who?(lc(who.prof)===lc(b.pr)):null,spec=who&&b.sp?(who.specs||[]).map(lc).includes(lc(b.sp)):null;
  const req=[`<b>${esc(b.pr)}</b>${b.sp&&b.sp!==b.pr?' · specialty <b>'+esc(b.sp)+'</b>':''} · level ${b.lv}`];
  if(who){req.push(prof?'<span class="b green">Has the profession</span>':'<span class="b red">Lacks the profession</span>');if(b.sp&&b.sp!==b.pr)req.push(spec?'<span class="b green">Has the specialty</span>':'<span class="b red">Crafts at disadvantage (outside their specialties)</span>')}
  if(/Infernal|Celestial|Void Smith/i.test(b.sp||''))req.push('<span class="b gold">Needs a smith with the matching realm specialty</span>');
  const traits=b.mats.map(findMat).filter(m=>m&&m.tr);
  $('cf-out').innerHTML=`<div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h4 style="font-size:1.25rem;margin:0">${refChip(b,esc(b.n))}</h4>${rarB(b.r)}<span class="b ghost">${esc(b.cat)}</span>${b.ac?`<span class="b">AC ${esc(b.ac)}</span>`:''}${b.dc?`<span class="b">${esc(b.dc)} ${esc(b.dm)}</span>`:''}</div>
    <div class="badges" style="gap:6px">${req.join('')}</div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Material</th><th>Grade</th><th class="num">Need</th>${who?'<th class="num">Has</th>':''}<th class="num">Each</th><th class="num">To buy</th><th>Where to get it</th><th>Refining</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="out" style="margin:0"><div class="big">${gp(total)}</div><div class="kv"><span>To make</span><span>${q} × ${esc(b.n)}</span><span>Still to buy</span><span>${missing.length?missing.map(([n,k])=>k+' × '+esc(n)).join(', '):'nothing, all materials on hand'}</span>${unsold?'<span>Note</span><span>Some materials are not sold; they must be hunted, gathered, or traded.</span>':''}</div></div>
    ${traits.length?`<div><div class="blk"><h4>Traits when equipped</h4></div><div class="mlist">${traits.map(m=>`<button data-ref="${ref(m)}" style="flex-direction:column;align-items:flex-start"><b style="color:var(--gold2)">◆ ${esc(m.tr.n)}</b><span style="font-size:.8rem">${esc(m.tr.t)}</span></button>`).join('')}</div></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="copyShopping()">Copy shopping list</button>
      ${who?`<button class="btn primary" onclick="craftNow()">Craft it: use ${esc(who.name||'their')} materials and add to gear</button>`:''}
    </div></div>`;

// ── Encounters ────────────────────────────────────────────────
const XP_TH=[null,[25,50,75,100],[50,100,150,200],[75,150,225,400],[125,250,375,500],[250,500,750,1100],[300,600,900,1400],[350,750,1100,1700],[450,900,1400,2100],[550,1100,1600,2400],[600,1200,1900,2800],[800,1600,2400,3600],[1000,2000,3000,4500],[1100,2200,3400,5100],[1250,2500,3800,5700],[1400,2800,4300,6400],[1600,3200,4800,7200],[2000,3900,5900,8800],[2100,4200,6300,9500],[2400,4900,7300,10900],[2800,5700,8500,12700]];
const DIFFS=['Easy','Medium','Hard','Deadly'];
const xpMult=n=>n<=1?1:n===2?1.5:n<=6?2:n<=10?2.5:n<=14?3:4;
function renderEncounter(){
  const st=store.get('enc',{size:Math.max(1,PARTY.length||4),level:Math.max(1,Math.round(PARTY.reduce((a,c)=>a+(+c.level||1),0)/(PARTY.length||1))||3),realm:'Human',diff:'Medium',hb:false,list:[]});
  $('content').innerHTML=`<div class="page">${datalists()}
    <div class="sec-h" style="margin-top:4px"><h3 style="font-size:1.5rem">Encounter builder</h3><p>Balanced fights from a realm's Bestiary, using the standard XP budget by party level.</p></div>
    <div class="tool"><div class="form" style="grid-template-columns:repeat(5,1fr)">
      <label>Party size<input id="en-size" type="number" min="1" max="10" value="${st.size}"></label>
      <label>Average level<input id="en-lv" type="number" min="1" max="20" value="${st.level}"></label>
      <label>Realm<select id="en-realm"><option value="">Any realm</option>${REALMS.map(r=>`<option${r.n===st.realm?' selected':''}>${esc(r.n)}</option>`).join('')}</select></label>
      <label>Difficulty<select id="en-diff">${DIFFS.map(d=>`<option${d===st.diff?' selected':''}>${d}</option>`).join('')}</select></label>
      <label class="chk" style="align-self:end"><input type="checkbox" id="en-hb"${st.hb?' checked':''}> Homebrew only</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primary" onclick="rollEncounter()">🎲 Build encounter</button>
      <span class="keyrow" style="flex:1;min-width:260px"><input class="sel" id="en-add" list="dl-mon" placeholder="Or add a monster by name…" style="max-width:none;flex:1"><button class="btn" onclick="addEncMon()">Add</button></span>
      <button class="btn" onclick="sendToCombat()">Send to combat tracker →</button></div></div>
    <div id="en-out" style="margin-top:14px"></div></div>`;
  ['en-size','en-lv','en-realm','en-diff','en-hb'].forEach(i=>$(i).addEventListener('change',()=>{saveEncInputs();encOut()}));
  encOut();
}
function saveEncInputs(){const st=store.get('enc',{});Object.assign(st,{size:+$('en-size').value||4,level:Math.min(20,Math.max(1,+$('en-lv').value||1)),realm:$('en-realm').value,diff:$('en-diff').value,hb:$('en-hb').checked});store.set('enc',st);return st}
const monXP=m=>m.sb?m.sb.xp:0;
function encBudget(st){const th=XP_TH[st.level]||XP_TH[1];return th.map(x=>x*st.size)}
function rollEncounter(){
  const st=saveEncInputs(),budget=encBudget(st)[DIFFS.indexOf(st.diff)];
  const pool=MONSTERS.filter(m=>(!st.realm||m.realm===st.realm)&&(!st.hb||m.hb)&&monXP(m)>0&&monXP(m)<=budget);
  if(!pool.length){st.list=[];store.set('enc',st);encOut('No monsters fit that budget in '+(st.realm||'any realm')+'. Try another realm or a higher level.');return}
  let best=null,bestScore=1e18;
  for(let t=0;t<400;t++){
    const k=1+Math.floor(Math.random()*Math.min(6,st.size+2)),pick=[];
    const lead=pool[Math.floor(Math.random()*pool.length)];pick.push(lead);
    for(let i=1;i<k;i++){const same=Math.random()<.5;const x=same?lead:pool[Math.floor(Math.random()*pool.length)];pick.push(monXP(x)<=monXP(lead)?x:lead)}
    const adj=pick.reduce((a,m)=>a+monXP(m),0)*xpMult(pick.length);
    const score=adj>budget*1.1?(adj-budget)*3:budget-adj;
    if(score<bestScore){bestScore=score;best=pick}
  }
  const counts=new Map();best.forEach(m=>counts.set(m,(counts.get(m)||0)+1));
  st.list=[...counts].map(([m,n])=>[m.n,n]);store.set('enc',st);encOut();
}
function addEncMon(){const v=$('en-add').value.trim(),m=MON_IDX.get(lc(v));if(!m){toast('No monster named “'+v+'”');return}const st=saveEncInputs();st.list=st.list||[];const r=st.list.find(x=>x[0]===m.n);if(r)r[1]++;else st.list.push([m.n,1]);store.set('enc',st);$('en-add').value='';encOut()}
function encSet(name,d){const st=store.get('enc',{});const r=(st.list||[]).find(x=>x[0]===name);if(!r)return;r[1]+=d;st.list=st.list.filter(x=>x[1]>0);store.set('enc',st);encOut()}
function encOut(msg){
  const st=store.get('enc',{}),list=(st.list||[]).map(([n,k])=>({m:MON_IDX.get(lc(n)),k})).filter(x=>x.m);
  const th=encBudget(st),count=list.reduce((a,x)=>a+x.k,0),raw=list.reduce((a,x)=>a+monXP(x.m)*x.k,0),adj=raw*xpMult(count);
  let diff='Trivial';th.forEach((t,i)=>{if(adj>=t)diff=DIFFS[i]});
  const loot=list.reduce((a,x)=>a+x.k*(x.m.drops||[]).reduce((s,d)=>s+((findMat(d[0])||{}).price||0),0),0);
  $('en-out').innerHTML=(msg?`<div class="note">${esc(msg)}</div>`:'')+`<div class="panel" style="display:flex;flex-direction:column;gap:12px">
    ${kv([['Difficulty',`<span style="color:${diff==='Deadly'?'var(--red)':diff==='Hard'?'var(--gold2)':'var(--green)'}">${diff}</span>`],['Adjusted XP',fmt(Math.round(adj))],['XP to award',fmt(raw)+' <small style="font-weight:400;color:var(--muted)">('+fmt(Math.round(raw/(st.size||1)))+' each)</small>'],['Budgets',th.map((t,i)=>DIFFS[i][0]+' '+fmt(t)).join(' · ')],['Loot value',gp(loot)+' <small style="font-weight:400;color:var(--muted)">one of each part</small>']])}
    ${list.length?`<div class="mlist">${list.map(x=>`<button data-ref="${ref(x.m)}"><b style="width:36px">${x.k}×</b>${esc(x.m.n)} <span class="x">${esc(x.m.realm)} ${x.m.g} · CR ${esc(x.m.sb.cr)} · AC ${x.m.sb.ac} · HP ${x.m.sb.hp}</span><span class="r"><span onclick="event.stopPropagation();encSet('${esc(x.m.n).replace(/'/g,"\\'")}',1)" title="One more">＋</span> <span onclick="event.stopPropagation();encSet('${esc(x.m.n).replace(/'/g,"\\'")}',-1)" title="One fewer">－</span> ${fmt(monXP(x.m)*x.k)} XP</span></button>`).join('')}</div>`:'<div class="note" style="margin:0">Press “Build encounter” or add monsters by name.</div>'}
  </div>`;
}
function sendToCombat(){
  const st=store.get('enc',{}),cb=store.get('combat',{round:1,turn:0,list:[]});
  (st.list||[]).forEach(([n,k])=>{const m=MON_IDX.get(lc(n));if(!m)return;for(let i=0;i<k;i++)cb.list.push(monCombatant(m,k>1?i+1:0))});

  store.set('combat',cb);go('combat');
}
function monCombatant(m,i){return {id:uid(),name:m.n+(i?' '+i:''),mon:m.n,init:0,dex:Math.floor(((m.sb?m.sb.ab[1]:10)-10)/2),hp:m.sb?m.sb.hp:10,max:m.sb?m.sb.hp:10,ac:m.sb?m.sb.ac:0,cond:[]}}

function slotFit(slot,m){
  if(!m)return slot.optional?{lv:'empty'}:{lv:'missing'};
  const c=matCode(m);
  if(!slot.ok.includes(c))return {lv:'wrong',c};
  const rx=slot.ideal&&slot.ideal[c];

  return {lv:'good',c};
}

  const prim=parts.find(p=>p.s.role==='primary');
  let hit=0,acAdj=0,breakOn=0,useless=false;const notes=[],props=[],traits=[];
  parts.forEach(p=>{
    if(p.fit.lv==='wrong'||p.fit.lv==='poor')notes.push([p.s.name,p.fit.lv,PENALTY[p.s.role][p.fit.lv]]);
    if(p.fit.lv==='wrong'){if(p.s.role==='primary'){useless=true;hit-=5;breakOn=Math.max(breakOn,5)}else if(p.s.role==='structure'){hit-=3;acAdj-=2;breakOn=Math.max(breakOn,3)}else hit-=1}
    if(p.fit.lv==='poor'){if(p.s.role!=='minor'){hit-=1;if(p.s.role==='primary')acAdj-=1;else breakOn=Math.max(breakOn,1)}}
    if(p.m&&p.fit.lv!=='wrong'){
      if(p.m.pn)props.push({m:p.m,s:p.s,half:p.s.role!=='primary'||p.fit.lv==='poor'});
      if(p.m.tr)traits.push({m:p.m,s:p.s});
    }
  });
  const used=parts.filter(p=>p.m);
  const il=used.length?Math.max(...used.map(p=>p.m.il||1)):0;
  const pm=prim&&prim.m;const pil=pm&&prim.fit.lv!=='wrong'?(pm.il||1):0;
  const strongest=used.slice().sort((a,b)=>(b.m.rank||0)-(a.m.rank||0))[0];
  const cost=used.reduce((a,p)=>a+(p.m.price||0)*p.s.qty,0);
  const out={B,parts,notes,props,traits,il,cost,strongest:strongest&&strongest.m,breakOn};
  if(B.dmg){
    let die=B.dmg[0];if(pil>=20)die+=2;if(pil>=35)die+=2;
    const bonus=Math.floor(pil/10);
    out.attack=bonus+hit;out.damage=useless?'1d2':`1d${die}${bonus?' + '+bonus:''}`;out.dtype=B.dmg[1];

  if(B.armor||B.shield){
    const c=pm&&matCode(pm);let base=0;
    if(pm&&prim.fit.lv!=='wrong')base=armorAC(B.shield?SHIELD_KIND[FORGE.shield]:ARMOR_SLOT_UNITS[FORGE.slot],c,pil);
    out.ac=Math.max(0,base+acAdj);out.weight=c==='O'?'Heavy':c==='B'?'Medium':'Light';out.drawback=drawbackFor(out.ac);
  }

  out.prof=prof;

  out.rar=strongest?strongest.m.rar:'';
  out.name=FORGE.name||(pm?pm.n.replace(/ (Ore|Ingot|Bar)$/,'')+' '+(B.armor?(FORGE.slot==='Body'?'Armor':FORGE.slot+' Armor'):B.shield?FORGE.shield:FORGE.base):FORGE.base);
  return out;
}

function aiSearch(inp){
  const q=lc(inp.query||'').trim(),words=q.split(/\s+/).filter(Boolean);
  const kinds=inp.kind&&inp.kind!=='any'?[KIND[inp.kind]]:['bp','mat','mon','god','realm','sub','demon','patron','spell'];
  const lim=Math.min(25,Math.max(1,inp.limit||10));
  const res=[];let total=0;
  for(const t of kinds){
    const arr=TYPES[t].arr;
    for(const x of arr){
      if(inp.realm&&lc(x.realm||realmOf(x.gr)||x.home||'')!==lc(inp.realm))continue;
      const g=t==='mat'||t==='mon'?x.g:null;
      if(inp.min_grade&&!(g>=inp.min_grade))continue;
      if(inp.max_grade&&!(g<=inp.max_grade))continue;
      if(inp.profession&&lc(x.pr)!==lc(inp.profession))continue;
      if(inp.min_level&&!(x.lv>=inp.min_level))continue;
      if(inp.max_level&&!(x.lv<=inp.max_level))continue;
      if(words.length){const h=x._ah||(x._ah=lc(HAY[t](x)));if(!words.every(w=>h.includes(w)))continue}
      total++;const n=lc(x.n);res.push([n===q?0:n.startsWith(q)?1:n.includes(q)?2:3,x]);
    }
  }
  res.sort((a,b)=>a[0]-b[0]||a[1].n.length-b[1].n.length);
  const out={totalMatches:total,showing:Math.min(lim,res.length),results:res.slice(0,lim).map(r=>brief(r[1]))};
  if(kinds.includes('spell')&&!SP.length)out.note='Spells are not loaded on this page; tell the user to open the Spells page to search spells.';
  return out;
}
function aiGet(inp){

}

const AI_SYSTEM=()=>`You are the FAND Assistant, a helper built into the FAND Compendium website for FAND (Fantasy and Numerous Disasters), a homebrew D&D campaign set in the world of Atrious. You answer questions from players and the DM about the campaign's Blueprints (craftable items), materials, monsters, realms, gods, professions, spells, subclasses, demons, patrons, and rules.

Ground every specific claim in the compendium: use search_compendium and get_entry to look things up rather than relying on memory, and say plainly when the data doesn't contain something. General D&D 5e knowledge is fine for context, but FAND's own rules (below) override the books where they differ. Don't invent stats, prices, or lore.

When you name an entry that exists in the compendium, wrap its exact name in double square brackets, like [[Adamantine]] or [[Zeus]], so the website can turn it into a link. Keep answers focused and skimmable: short paragraphs and bullet lists, bold for key numbers. Don't use tables. Show the arithmetic briefly when you calculate something (damage after AC, prices, refining counts).

FAND cosmology: Infinatas (sometimes written Infinitas) is the highest being and cares only for balance, keeping it through creation. Inane is Infinatas's split personality and keeps balance through destruction; to the gods it was an unknown entity. The gods' own world eroded because of Inane, and Infinatas allowed the gods into this realm under strict regulation.

FAND rules summary:
- Armor Class starts at 0. Armor and other gear each add a small amount of AC to the total: slot units Body 4, Head 2, Hands/Feet/Shoulders/Back 1 each (a full set is 10); shields Buckler 1, Shield 2, Tower 3; x1 for metal, x0.7 bone/scale/stone, x0.4 hide/cloth, x(1 + (Item Level - 1)/20); minimum 1 per piece. A full set of iron gear gives 10 AC. Armor that gives more AC carries drawbacks: for example, full iron gear gives +10 AC but you lose Acrobatics, Athletics, and Dexterity. AC is subtracted flat from the total damage of each hit: damage taken = damage - AC.
- Material grading: every material has a realm (tier 1-10) and a grade 1-10. Material Rank = (tier - 1) x 10 + grade (1-100). Item Level = ceil(Rank / 2) (1-50). Blueprints record their strongest material.
- Material origins and unique traits: creature parts carry a unique trait drawn from the creature's signature ability and the body part (a hawk's eye sharpens sight; troll blood regenerates); plants give small herbal effects; ores, stones, gems, and supplies are basic and carry only their property. An item gains the unique traits of its materials while equipped.
- Material properties: each material gives a property (48 in all); supplies give none. Potency = min(10, max(1, floor(Item Level / 5)) + 1 at grade 9, + 2 at grade 10). Weapons, armor, and shields carry the property of their strongest material.
- Refining: 3 materials of one grade make 1 of the next grade. Moving up to the next realm takes 5, a binding agent, and a Realm Forge.
- Custom Blueprints: players design items from a primary material and up to two secondaries, then pass a design check; traits come from the materials' properties.
- Money: each realm has its own coin worth its base price / 5 gp: ${REALMS.filter(r=>CURRENCY[r.n]&&CURRENCY[r.n].coin).map(r=>CURRENCY[r.n].coin+' ('+r.n+') = '+CURRENCY[r.n].gp+' gp').join(', ')}. Void, Inner Void, and Primordial have no coin. Moneychangers take 10%. Flux Chips (Chaos) change value daily: 2d6 x 50 gp.\n- Monsters have generated stat blocks in the Monster Manual layout (use get_entry for them) and 6-10 harvestable parts each.\n- Economy: price = realm base x grade (doubled at grade 9-10; supplies cost one fifth). Merchants buy at half. Void-grade materials and above aren't sold.
- Professions: 10 (Blacksmithing, Carving, Tailoring, Alchemy, Cooking, Enchanting, Engineering, Harvesting, Scavenging, Navigation); the 31 old crafts are specialties. You start with one specialty and gain more; crafting outside your specialties is at disadvantage. Hell, Heaven, and Void metals need a Blacksmith with the matching realm specialty. Harvesting gathers ore, stone, crystal, and plants; Scavenging strips hide, bone, blood, organs, and essences from corpses. Profession XP comes from crafting, designing, refining, and gathering.
- Realm Travel: each realm has a Pressure 0-9; a traveler's Attunement comes from level, contract rank, or realm-material gear. If Pressure exceeds Attunement the traveler suffers strain. 11 travel methods; an anchor from home eases the return.
- God Contracts: ten ranks from Minor up to 1st Finger; the five Fingers form a god's Hand. Each rank has spells, AC, duties, and rewards. Gods sharing a Rune are rivals.
- Monsters: homebrew monsters have level, HP, AC, attacks, a save DC, and a signature trait from their best drop; grade 10 monsters have boss rules. Official monsters have CR, a grade from CR, and graded drops; no stat blocks.
- Every class picks its subclass at level 3.
- The Forge: every weapon and armor is a base design (Axe, Sword, Dagger, Hammer, Spear, Bow, Staff, Body Armor, Shield, Focus) built from parts. Each part accepts certain material categories (an axe head takes metal, stone, or hard bone/horn/fang). The main part sets damage or AC from its material's Item Level; every part's property and unique trait apply (secondary parts at half Potency). A wrong material in the main part makes the item useless (1d2 damage, -5 to hit, breaks on 1-5); in a structural part -3 to hit and breaks on 1-3.
- Armor drawbacks by total armor AC worn: 10+ = lose Acrobatics, Athletics, and Dexterity (campaign rule); 4-6 and 7-9 rows are proposed (Stealth; Stealth and Acrobatics at disadvantage).

Realms (tier, base price per grade): ${REALMS.map(r=>r.n+' (tier '+r.tier+', '+(r.base?r.base+' gp':'not sold')+')').join('; ')}.

The user is currently on the ${(TABS.find(t=>t[0]===(SITE?SITE.page:'home'))||[])[1]||'Home'} page of the website.`;
function linkify(html){
  return html.replace(/\[\[([^\]]{1,120})\]\]/g,(m,name)=>{
    const raw=name.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
    for(const t of ['mat','bp','mon','god','realm','sub','demon','patron','spell']){
      const arr=TYPES[t].arr,n=lc(raw);const x=arr.find(y=>lc(y.n)===n)||(t==='god'||t==='demon'||t==='patron'?arr.find(y=>lc(y.n.split(' - ')[0])===n):null);
      if(x)return `<button class="chip" data-ref="${ref(x)}">${name}</button>`;
    }
    return '<strong>'+name+'</strong>';
  });
}
function md(src){
  const lines=esc(src).split('\n');let out='',list=null;
  const inline=s=>linkify(s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>'));
  const close=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const l of lines){
    let m;
    if((m=/^\s*[-*•]\s+(.*)/.exec(l))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>'}
    else if((m=/^\s*\d+[.)]\s+(.*)/.exec(l))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>'}
    else if((m=/^#{1,4}\s+(.*)/.exec(l))){close();out+='<h4>'+inline(m[1])+'</h4>'}
    else if(!l.trim()){close()}
    else{close();out+='<p>'+inline(l)+'</p>'}
  }
  close();return out;
}
function toggleAI(on){const a=$('ai'),v=on==null?!a.classList.contains('open'):on;a.classList.toggle('open',v);$('aiFab').style.display=v?'none':'';if(v){renderAI();setTimeout(()=>$('aiQ').focus(),50)}}
function newChat(){if(AI.busy)return;AI.msgs=[];AI.view=[];saveChat();renderAI()}
const AI_SUGG=['What can I craft with Adamantine?','Which monsters in Hell drop grade 5+ materials?','How much damage does a 30-damage hit do against AC 12?','Who are Zeus\'s rivals and why?','Plan refining Human 1 materials up to Mysterious 1'];
function renderAI(statusText){
  const box=$('aiMsgs');
  if(!getKey()){box.innerHTML=`<div class="ai-empty"><b>Ask anything about FAND</b><span>The assistant looks things up in this compendium and answers with links to the entries it used. It runs on Claude through your own Anthropic API key, which stays in this browser.</span><div><button class="btn primary" onclick="openSettings()">Add your API key</button></div></div>`;return}
  if(!AI.view.length&&!statusText){box.innerHTML=`<div class="ai-empty"><b>Ask anything about FAND</b><span>Try one of these:</span><div class="ai-sugg">${AI_SUGG.map(s=>`<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;return}
  box.innerHTML=AI.view.map(v=>v.role==='user'?`<div class="ai-m user">${esc(v.text)}</div>`:v.role==='err'?`<div class="ai-m err">${esc(v.text)}</div>`:`<div class="ai-m bot">${md(v.text)}</div>`).join('')+(statusText?`<div class="ai-status" id="aiStatus">${esc(statusText)}</div>`:'');
  box.scrollTop=box.scrollHeight;
}
$('aiMsgs').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){$('aiQ').value=b.dataset.q;ask()}});
$('aiForm').addEventListener('submit',e=>{e.preventDefault();ask()});
$('aiQ').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
$('aiQ').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});
function loadSDK(){
  if(window.Anthropic)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/anthropic.js';s.onload=()=>window.Anthropic?res():rej(new Error('sdk'));s.onerror=()=>rej(new Error('The assistant library could not be loaded.'));document.head.appendChild(s)});
}
function setStatus(t){const s=$('aiStatus');if(s)s.textContent=t;else renderAI(t)}
async function ask(){
  const q=$('aiQ').value.trim();if(!q||AI.busy)return;
  if(!getKey()){openSettings();return}
  AI.busy=true;$('aiSend').disabled=true;$('aiQ').value='';$('aiQ').style.height='';
  AI.view.push({role:'user',text:q});AI.msgs.push({role:'user',content:q});saveChat();
  renderAI('Thinking…');
  const bot={role:'bot',text:''};let shown=false;
  try{
    await loadSDK();
    const Anthropic=window.Anthropic;
    if(!AI.client)AI.client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
    let jsonRetries=0;
    for(let turn=0;turn<10;turn++){
      const stream=AI.client.beta.messages.stream({
        model:AI.model,max_tokens:64000,
        betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
        output_config:{effort:'medium'},
        cache_control:{type:'ephemeral'},
        system:AI_SYSTEM(),tools:AI_TOOLS,messages:AI.msgs,
      });
      stream.on('text',d=>{if(!shown){AI.view.push(bot);shown=true}bot.text+=d;renderAI('Writing…')});
      let msg;
      try{msg=await stream.finalMessage();jsonRetries=0}
      catch(err){if(err instanceof Anthropic.APIError||jsonRetries++>=2)throw err;continue}
      if(msg.stop_reason==='refusal'){AI.msgs.push({role:'assistant',content:msg.content});if(!shown){AI.view.push(bot);shown=true}bot.text+=(bot.text?'\n\n':'')+'*I can\'t help with that request.*';break}
      if(msg.stop_reason==='pause_turn'){AI.msgs.push({role:'assistant',content:msg.content});continue}
      const uses=msg.content.filter(b=>b.type==='tool_use');
      AI.msgs.push({role:'assistant',content:msg.content});
      if(msg.stop_reason==='max_tokens'&&uses.length)throw new Error('The answer was cut off. Try a narrower question.');
      if(msg.stop_reason!=='tool_use'||!uses.length)break;
      const results=[];
      for(const u of uses){
        if(!validTool(u.name,u.input)){results.push({type:'tool_result',tool_use_id:u.id,is_error:true,content:JSON.stringify({INVALID_JSON:JSON.stringify(u.input)})});continue}
        setStatus(u.name==='get_entry'?'Reading '+u.input.name+'…':'Searching the compendium'+(u.input.query?' for “'+u.input.query+'”':'')+'…');
        let r;try{r=u.name==='get_entry'?aiGet(u.input):aiSearch(u.input)}catch(e){r={error:String(e&&e.message||e)}}
        results.push({type:'tool_result',tool_use_id:u.id,content:JSON.stringify(r)});
      }
      AI.msgs.push({role:'user',content:results});
      if(bot.text&&!/\n$/.test(bot.text))bot.text+='\n\n';
      setStatus('Thinking…');
    }
  }catch(err){
    const A=window.Anthropic;let m=err&&err.message||String(err);
    if(A&&err instanceof A.AuthenticationError)m='Your API key was rejected. Check it in Settings.';
    else if(A&&err instanceof A.PermissionDeniedError)m='This API key isn\'t allowed to use '+AI.model+'.';
    else if(A&&err instanceof A.RateLimitError)m='Rate limit reached. Wait a moment and try again.';
    else if(A&&err instanceof A.APIConnectionError)m='Couldn\'t reach Anthropic. Check your connection.';
    else if(A&&err instanceof A.APIError)m='The API returned an error: '+m;
    // Drop the unanswered turn so the conversation stays valid for the next question.
    while(AI.msgs.length&&!(AI.msgs[AI.msgs.length-1].role==='assistant'&&!AI.msgs[AI.msgs.length-1].content.some(b=>b.type==='tool_use')))AI.msgs.pop();
    AI.view.push({role:'err',text:m});
  }
  if(shown&&!bot.text.trim())AI.view.splice(AI.view.indexOf(bot),1);
  AI.busy=false;$('aiSend').disabled=false;saveChat();renderAI();
}
