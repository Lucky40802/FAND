<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root{
  --bg:#0b0a12;--bg2:#0f0e18;--surf:#14131f;--surf2:#1b1a29;--surf3:#242336;
  --line:#2a2840;--line3:#3a3756;
  --text:#ece8f4;--text2:#c6c1d8;--muted:#8a85a6;--muted2:#5d5878;
  --acc:#8b7cf6;--acc2:#c4b5fd;--accbg:rgba(139,124,246,.14);
  --gold:#d9b25a;--gold2:#f2d27e;--goldbg:rgba(217,178,90,.12);
  --red:#ef6b6b;--green:#5fd18b;--blue:#6aaef0;
  --c-common:#9a98a8;--c-uncommon:#5fd18b;--c-rare:#6aaef0;--c-vrare:#b49cff;--c-legend:#f59e52;--c-artifact:#f47171;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:10px;
  --serif:'Palatino Linotype','Book Antiqua',Palatino,'Iowan Old Style',Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f4efe4;--bg2:#efe8da;--surf:#fbf8f1;--surf2:#f3ecdf;--surf3:#e9e0cf;
  --line:#ddd2bd;--line3:#c9bba2;
  --text:#2a2318;--text2:#4a4030;--muted:#7a6d58;--muted2:#a39579;
  --acc:#6b4fd8;--acc2:#5a3fc4;--accbg:rgba(107,79,216,.1);
  --gold:#9a6f12;--gold2:#7f5a08;--goldbg:rgba(154,111,18,.1);
  --red:#c03b3b;--green:#2f8f57;--blue:#2f6fb3;
  --c-common:#77746a;--c-uncommon:#2f8f57;--c-rare:#2f6fb3;--c-vrare:#7a52d1;--c-legend:#c56a12;--c-artifact:#c03b3b;
  --shadow:0 10px 30px rgba(60,40,10,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:.01em}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--acc);background-clip:padding-box}

/* ── Top bar ────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--acc) 70%,transparent);opacity:.45}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;text-align:left}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.brand h1{font-size:1.25rem;letter-spacing:.22em;line-height:1;background:linear-gradient(100deg,var(--acc2),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.08em;margin-top:3px;font-family:var(--serif);font-style:italic}
.search-btn{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:.86rem;text-align:left}
.search-btn:hover{border-color:var(--acc)}
.search-btn span{flex:1}
kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surf2)}
.icon-btn{background:var(--surf);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--text2);flex-shrink:0}
.icon-btn:hover{border-color:var(--acc);color:var(--text)}
.icon-btn svg{width:18px;height:18px}

/* ── Tabs ───────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 9px;font-size:.84rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.navg{position:relative}
.navg>.tab .car{font-size:.65rem;opacity:.7;margin-left:2px}
.navpop{position:fixed;z-index:48;min-width:260px;max-width:min(92vw,380px);background:var(--surf);border:1px solid var(--line3);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;animation:pop .12s ease-out}
.navpop.open{display:block}
.navpop a{display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text2)}
.navpop a:hover,.navpop a.on{background:var(--accbg);color:var(--text)}
.navpop a b{font-weight:600;color:var(--text)}
.navpop a small{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.navpop a .n{margin-left:auto;font-size:.7rem;color:var(--muted2)}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.tab .n{font-size:.68rem;color:var(--muted2);font-variant-numeric:tabular-nums}
.tab.on .n{color:var(--gold)}

/* ── Workspace ──────────────────────────────────────────────── */
.ws{flex:1;display:flex;min-height:0}
.sb{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 20px}
.sb[hidden]{display:none}
.sb-h{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);padding:8px 16px 6px;font-weight:600}
.sb-i{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-left:2px solid transparent;padding:6px 14px;font-size:.84rem;color:var(--text2);text-align:left}
.sb-i:hover{background:var(--surf);color:var(--text)}
.sb-i.on{border-left-color:var(--gold);background:var(--goldbg);color:var(--text)}
.sb-i.sub{padding-left:30px;font-size:.79rem;color:var(--muted)}
.sb-i.sub.on{color:var(--text)}
.sb-i .c{margin-left:auto;font-size:.7rem;color:var(--muted2);font-variant-numeric:tabular-nums}
.sb-i .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-sep{height:1px;background:var(--line);margin:6px 14px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0}
.ctrl[hidden]{display:none}
.field{position:relative;flex:1 1 240px;min-width:180px}
.field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.field input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 32px;font-size:.88rem;outline:none}
.field input:focus{border-color:var(--acc)}
.field .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:1rem;padding:2px 6px;display:none}
.field.has .clear{display:block}
select.sel,.btn{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;color:var(--text2);outline:none;max-width:220px}
select.sel:hover,.btn:hover{border-color:var(--acc)}
select.sel.set{border-color:var(--gold);color:var(--text)}
.btn.on{border-color:var(--gold);color:var(--gold2);background:var(--goldbg)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.count{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters-btn{display:none}
.content{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth}
.chips-active{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chips-active:empty{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--goldbg);border:1px solid var(--gold);color:var(--text);border-radius:20px;padding:2px 4px 2px 10px;font-size:.75rem}
.achip button{background:none;border:0;color:var(--muted);padding:0 5px;font-size:.9rem}

/* ── Cards ──────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,box-shadow .15s;overflow:hidden;min-width:0}
.card:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:var(--shadow)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--strip,transparent)}
.card .t{display:flex;align-items:flex-start;gap:8px}
.card .nm{font-family:var(--serif);font-weight:700;font-size:1rem;line-height:1.25;color:var(--text);flex:1;min-width:0;overflow-wrap:anywhere}
.card .ep{font-size:.78rem;color:var(--muted);font-style:italic;font-family:var(--serif);margin-top:-3px}
.card .ds{font-size:.8rem;color:var(--text2);opacity:.85;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ln{font-size:.78rem;color:var(--text2)}
.card .ln b{color:var(--text);font-weight:600}
.card .pin{color:var(--gold);font-size:.85rem}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:20px;background:var(--surf3);color:var(--text2);border:1px solid transparent;white-space:nowrap}
.b.acc{background:var(--accbg);color:var(--acc2)}
.b.gold{background:var(--goldbg);color:var(--gold2)}
.b.red{background:rgba(239,107,107,.12);color:var(--red)}
.b.green{background:rgba(95,209,139,.12);color:var(--green)}
.b.blue{background:rgba(106,174,240,.12);color:var(--blue)}
.b.ghost{background:none;border-color:var(--line3);color:var(--muted)}
.b .sw{width:7px;height:7px;border-radius:50%}
.r-Common{--rc:var(--c-common)}.r-Uncommon{--rc:var(--c-uncommon)}.r-Rare{--rc:var(--c-rare)}.r-Very_Rare{--rc:var(--c-vrare)}.r-Legendary{--rc:var(--c-legend)}.r-Artifact{--rc:var(--c-artifact)}
.b.rar{color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:2px 8px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);color:var(--text2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
button.chip:hover,a.chip:hover{border-color:var(--acc);color:var(--text)}
.chip .sw{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip small{color:var(--muted);font-size:.68rem}
.more{display:flex;justify-content:center;padding:18px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--text2);margin-bottom:6px}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line3)}
.pips i.on{background:var(--gold)}

/* ── Pages (home, realms, rules, tools) ─────────────────────── */
.page{max-width:1180px;margin:0 auto}
.hero{position:relative;border:1px solid var(--line);border-radius:16px;padding:34px 30px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,var(--accbg),transparent 55%),radial-gradient(90% 120% at 100% 100%,var(--goldbg),transparent 60%),var(--surf)}
.hero h2{font-size:2.1rem;line-height:1.1;margin-bottom:8px}
.hero p{color:var(--text2);max-width:640px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-search{margin-top:20px;display:flex;align-items:center;gap:10px;max-width:560px;background:var(--bg);border:1px solid var(--line3);border-radius:10px;padding:11px 14px;color:var(--muted);cursor:text;width:100%;text-align:left}
.hero-search:hover{border-color:var(--acc)}
.hero-search span{flex:1}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h3{font-size:1.2rem}
.sec-h p{color:var(--muted);font-size:.85rem}
.sheet .sh-head{display:grid;grid-template-columns:1fr 2fr;gap:12px;align-items:end;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel,var(--bg))}
.sheet .sh-name input{font:700 1.4rem var(--serif);width:100%}
.sheet .sh-hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet input,.sheet select,.sheet textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--text);font:inherit;max-width:100%}
.sheet .sh-hgrid input,.sheet .sh-hgrid select{width:100%}.sheet .sh-hgrid>div:first-child{display:flex;gap:6px;flex-wrap:wrap}
.sheet textarea{width:100%;resize:vertical}
.sheet .sh-lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;text-align:center}
.sheet .sh-cols{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px}
.sheet .sh-col{display:flex;flex-direction:column;gap:10px}
.sheet .sh-col:first-child{display:grid;grid-template-columns:110px 1fr;gap:10px;align-content:start}
.sheet .sh-abil{display:flex;flex-direction:column;gap:8px}
.sheet .sh-ab{border:2px solid var(--line);border-radius:12px;text-align:center;padding:6px}
.sheet .sh-ab .sh-mod{font:700 1.7rem var(--serif)}.sheet .sh-ab input{width:56px;text-align:center;border-radius:20px}
.sheet .sh-col2{display:flex;flex-direction:column;gap:8px}
.sheet .sh-row{display:flex;align-items:center;gap:8px}
.sheet .sh-pill{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:32px;border:2px solid var(--line);border-radius:16px;font-family:var(--serif)}
.sheet .sh-list{border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.sheet .sh-list label{display:flex;align-items:center;gap:6px}.sheet .sh-list b{width:30px;text-align:right;font-variant-numeric:tabular-nums}.sheet .sh-list small{color:var(--muted)}
.sheet .sh-box{border:2px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sheet .sh-box.tall{min-height:420px}
.sheet .sh-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sheet .sh-trio .sh-box{align-items:center;text-align:center}
.sheet .sh-big{font:700 1.9rem var(--serif);line-height:1.1}
.sheet .sh-coins{display:flex;gap:6px;flex-wrap:wrap}.sheet .sh-coins label{display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--muted)}.sheet .sh-coins input{width:64px}
.sheet .sh-ul{margin:0;padding-left:18px;font-size:.88rem}.sheet .sh-t{font-size:.85rem}
.sheet .sh-feat{font-size:.85rem;border-bottom:1px dashed var(--line);padding-bottom:6px}.sheet .sh-feat ul{margin:4px 0 0 16px;padding:0}
.sheet .sh-fand{margin-top:12px}
.sheet .sh-spells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.sheet .sh-cols{grid-template-columns:1fr}.sheet .sh-head{grid-template-columns:1fr}.sheet .sh-spells{grid-template-columns:1fr}}
@media (max-width:640px){.sheet .sh-hgrid{grid-template-columns:1fr 1fr}.sheet .sh-col:first-child{grid-template-columns:90px 1fr}}
@media print{.sheet .sh-noprint,.sheet .sec-h,.ai-fab{display:none!important}.sheet .sh-page{display:block!important;break-after:page}.sheet .sh-page[hidden]{display:block!important}.sheet input,.sheet textarea,.sheet select{border:none;border-bottom:1px solid #999;border-radius:0}.sheet .sh-cols{grid-template-columns:1.15fr 1fr 1fr!important}}

.dice{border-bottom:1px dashed var(--gold);cursor:pointer;white-space:nowrap}.dice:hover{background:var(--goldbg)}
#dice-ov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.55);backdrop-filter:blur(2px);cursor:pointer}
#dice-ov.on{display:flex}
.dice-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.dice-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:90vw}
.die{position:relative;width:96px;height:96px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.die svg{width:100%;height:100%}.die polygon{fill:var(--acc,#6d4bd6);stroke:#fff;stroke-width:3;stroke-linejoin:round}
.die span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:700 1.9rem var(--serif);text-shadow:0 2px 4px rgba(0,0,0,.4)}
#dice-ov.spin .die{animation:dieSpin .9s cubic-bezier(.2,.7,.3,1) var(--d) both}
@keyframes dieSpin{0%{transform:translate(-60vw,-30vh) rotate(-540deg) scale(.4);opacity:0}60%{opacity:1}80%{transform:translate(0,0) rotate(12deg) scale(1.08)}100%{transform:none}}
.dice-total{display:flex;flex-direction:column;align-items:center;color:#fff;background:rgba(0,0,0,.35);padding:10px 22px;border-radius:14px}
.dice-total b{font:700 3rem var(--serif);line-height:1}.dice-total .dice-expr{font-size:.85rem;opacity:.8}.dice-total small{opacity:.85}
.rtree{list-style:none;padding-left:16px;margin:0;border-left:1px solid var(--line)}.rtree li{margin:3px 0;font-size:.9rem}.rtree summary{cursor:pointer}.rtree>li>details>summary::marker{color:var(--gold)}
@media (max-width:640px){.sec-h{flex-direction:column;align-items:flex-start;gap:4px}.tools .form{grid-template-columns:1fr 1fr!important}}
.sec-h .btn{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat:hover{border-color:var(--acc)}
.stat .v{font-family:var(--serif);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.rung{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.rung::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--rc)}
.rung:hover{border-color:var(--rc)}
.rung .tier{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.rung .nm{font-family:var(--serif);font-size:1.1rem;font-weight:700}
.rung .ln{font-size:.78rem;color:var(--text2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h4{font-size:1rem;margin-bottom:8px}
.panel p,.panel li{font-size:.86rem;color:var(--text2)}
.panel ul{padding-left:18px;display:flex;flex-direction:column;gap:5px}
.vtag{font-family:var(--mono);font-size:.68rem;color:var(--gold2);background:var(--goldbg);border-radius:4px;padding:0 5px;margin-right:4px}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--surf2)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:var(--surf2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tablewrap table.t tr:last-child td{border-bottom:0}

/* rules */
.rules{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
.toc{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.toc a{color:var(--text2);text-decoration:none;font-size:.85rem;padding:5px 10px;border-radius:6px;border-left:2px solid transparent}
.toc a:hover{background:var(--surf);color:var(--text)}
.rule{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:14px;scroll-margin-top:10px}
.rule h3{font-size:1.25rem;margin-bottom:4px}
.rule .src{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.rule p,.rule li{font-size:.9rem;color:var(--text2);line-height:1.65}
.rule ul{padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.rule p+p{margin-top:8px}
.formula{font-family:var(--mono);font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:9px 12px;margin:10px 0;color:var(--text);overflow-x:auto}
.rule .tablewrap{margin-top:10px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}
.tool{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tool h3{font-size:1.1rem;margin-bottom:2px}
.tool .sub{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.form label.full{grid-column:1/-1}
.form input,.form select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--text);outline:none;width:100%}
.form input:focus,.form select:focus{border-color:var(--acc)}
.form .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.86rem;color:var(--text2)}
.form .chk input{width:auto}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.out .big{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--gold2);line-height:1.1;font-variant-numeric:tabular-nums}
.out .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.84rem;margin-top:6px}
.out .kv span:nth-child(odd){color:var(--muted)}
.out .kv span:nth-child(even){font-variant-numeric:tabular-nums}
.note{font-size:.75rem;color:var(--muted);margin-top:8px;line-height:1.5}
.bar{height:6px;border-radius:6px;background:var(--surf3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
svg.curve{width:100%;height:auto;margin-top:10px;display:block}
.enc{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.enc-row{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.enc-row .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.enc-row .h button{background:none;border:0;font-family:var(--serif);font-weight:700;font-size:.98rem;color:var(--text);padding:0;text-align:left}
.enc-row .h button:hover{color:var(--acc2)}

/* ── Modal ──────────────────────────────────────────────────── */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(5,4,10,.7);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.mbg.open{display:flex}
.modal{position:relative;width:100%;max-width:760px;background:var(--surf);border:1px solid var(--line3);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.mh{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,var(--surf2),var(--surf))}
.mh::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--strip,linear-gradient(90deg,var(--acc),var(--gold)))}
.mh .kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.mh h2{font-size:1.55rem;line-height:1.2;padding-right:150px;overflow-wrap:anywhere}
.mh .ep{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:2px}
.mh .badges{margin-top:10px}
.mact{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.mact .icon-btn{width:32px;height:32px}
.mact .icon-btn.on{color:var(--gold);border-color:var(--gold)}
.mb{padding:16px 22px 22px;display:flex;flex-direction:column;gap:16px}
.kvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kvg>div{padding:8px 11px;display:flex;flex-direction:column;gap:1px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kvg span{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kvg b{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.prose{font-family:var(--serif);font-size:1rem;line-height:1.7;color:var(--text2)}
.prose.lost{font-family:var(--sans);font-size:.85rem;color:var(--muted);border:1px dashed var(--line3);border-radius:8px;padding:10px 12px}
.blk h4{font-family:var(--sans);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.blk h4 em{font-style:normal;color:var(--muted2);letter-spacing:.04em;text-transform:none;font-size:.75rem}
.callout{background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--text2)}
.callout b{color:var(--gold2)}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mlist button{display:flex;gap:10px;align-items:center;background:var(--surf);border:0;border-bottom:1px solid var(--line);padding:7px 11px;text-align:left;font-size:.85rem;color:var(--text2)}
.mlist button:last-child{border-bottom:0}
.mlist button:hover{background:var(--surf2);color:var(--text)}
.mlist .r{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mlist .x{font-size:.75rem;color:var(--muted)}
details.fold summary{cursor:pointer;font-size:.8rem;color:var(--acc2);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:'▸ '}
details.fold[open] summary::before{content:'▾ '}
details.fold>div{margin-top:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.vcard{background:var(--surf2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:.78rem}
.vcard b{display:block;color:var(--text);font-size:.82rem}
.vcard .bn{font-family:var(--mono);color:var(--gold2);font-size:.75rem}
.vcard.mine{border-color:var(--gold)}
.mnav{display:flex;justify-content:space-between;gap:8px;padding:10px 22px;border-top:1px solid var(--line);background:var(--surf2)}
.mnav .btn{font-size:.78rem}
.mnav .pos{font-size:.75rem;color:var(--muted);align-self:center}

/* ── Command palette ────────────────────────────────────────── */
.pal{width:100%;max-width:640px;background:var(--surf);border:1px solid var(--line3);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.pal-in input{flex:1;background:none;border:0;outline:none;font-size:1.02rem}
.pal-res{max-height:60vh;overflow-y:auto;padding:6px 0}
.pal-g{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);padding:8px 16px 4px;font-weight:600}
.pal-i{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:7px 16px;text-align:left;font-size:.9rem;color:var(--text2)}
.pal-i.sel{background:var(--accbg);color:var(--text)}
.pal-i .r{margin-left:auto;font-size:.72rem;color:var(--muted);white-space:nowrap}
.pal-i mark{background:none;color:var(--gold2);font-weight:700}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surf3);border:1px solid var(--line3);color:var(--text);padding:8px 14px;border-radius:8px;font-size:.84rem;opacity:0;transition:all .2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width:900px){
  .sb{position:fixed;z-index:40;top:0;bottom:0;left:0;width:280px;box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .2s}
  .sb.drawer{transform:none}
  .filters-btn{display:inline-flex}
  .cols,.rules{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;flex-wrap:wrap}
  .tools{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:14px}
  .top{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .search-btn span,.search-btn kbd{display:none}
  .search-btn{flex:0 0 36px;width:36px;height:36px;justify-content:center;padding:0;margin-left:auto}
  .content{padding:12px}
  .hero{padding:24px 18px}
  .hero h2{font-size:1.6rem}
  .grid,.grid.sm{grid-template-columns:1fr}
  .mbg{padding:0}
  .modal{border-radius:0;min-height:100%;border:0}
  .mh h2{padding-right:0;padding-top:34px;font-size:1.3rem}
  .form{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.4);display:none}
.scrim.on{display:block}
/* stat block */
.sblk{background:color-mix(in srgb,var(--gold) 5%,var(--surf));border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-top:4px solid #a33a2a;border-bottom:4px solid #a33a2a;border-radius:6px;padding:12px 16px;font-size:.88rem;line-height:1.5}
.sblk .sbn{font-family:var(--serif);font-size:1.35rem;font-weight:700;color:#c0503a;font-variant:small-caps;letter-spacing:.02em}
:root[data-theme="light"] .sblk .sbn{color:#7a1f12}
.sblk .sbt{font-style:italic;color:var(--text2);margin-bottom:6px}
.sblk hr{border:0;height:2px;background:linear-gradient(90deg,#a33a2a,transparent);margin:7px 0}
.sblk .ln b{color:#c0503a;font-weight:700}
:root[data-theme="light"] .sblk .ln b,:root[data-theme="light"] .sblk h5{color:#7a1f12}
.sblk .abil{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;gap:4px}
.sblk .abil b{display:block;color:#c0503a;font-size:.75rem}
.sblk h5{font-family:var(--serif);font-size:1.05rem;color:#c0503a;border-bottom:1px solid #a33a2a;margin:10px 0 6px;font-variant:small-caps;font-weight:700}
.sblk p{margin:0 0 6px;color:var(--text2)}
.sblk p i b{color:var(--text)}
.sblk .gen{font-size:.72rem;color:var(--muted);margin-top:8px}
/* monster lore */
.lore h5{font-family:var(--serif);font-size:1.05rem;color:var(--text);margin:14px 0 4px;font-variant:small-caps;letter-spacing:.02em}
.lore p{font-family:var(--serif);font-size:.98rem;line-height:1.7;color:var(--text2)}
/* assistant + settings */
.ai-fab{position:fixed;right:20px;bottom:20px;z-index:44;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--acc),#a07cf0);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:.9rem;box-shadow:0 8px 28px rgba(80,60,200,.45)}
.ai-fab:hover{filter:brightness(1.08)}
.ai{position:fixed;top:0;right:0;bottom:0;z-index:45;width:min(440px,100vw);background:var(--surf);border-left:1px solid var(--line3);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s}
.ai.open{transform:none}
.ai-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surf2)}
.ai-h h3{font-size:1.05rem;flex:1}
.ai-h small{display:block;font-family:var(--sans);font-weight:400;font-size:.7rem;color:var(--muted)}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ai-m{max-width:100%;font-size:.9rem;line-height:1.6}
.ai-m.user{align-self:flex-end;background:var(--accbg);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:85%;white-space:pre-wrap}
.ai-m.bot{color:var(--text2)}
.ai-m.bot p{margin:0 0 8px}.ai-m.bot ul,.ai-m.bot ol{margin:0 0 8px 20px}.ai-m.bot h4{font-size:.95rem;margin:10px 0 4px;color:var(--text)}
.ai-m.bot code{font-family:var(--mono);font-size:.82rem;background:var(--surf3);padding:0 4px;border-radius:4px}
.ai-m.bot strong{color:var(--text)}
.ai-m.err{color:var(--red);font-size:.85rem;border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:8px;padding:8px 10px}
.ai-status{font-size:.78rem;color:var(--muted);font-style:italic;display:flex;align-items:center;gap:8px}
.ai-status::before{content:'';width:12px;height:12px;border-radius:50%;border:2px solid var(--line3);border-top-color:var(--gold);animation:spin .8s linear infinite}
.ai-in{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;background:var(--surf2)}
.ai-in textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:.9rem;color:var(--text);outline:none;max-height:140px;min-height:40px}
.ai-in textarea:focus{border-color:var(--acc)}
.ai-sugg{display:flex;flex-wrap:wrap;gap:6px}
.ai-sugg button{background:var(--surf2);border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:.8rem;color:var(--text2);text-align:left}
.ai-sugg button:hover{border-color:var(--acc);color:var(--text)}
.ai-empty{color:var(--muted);font-size:.86rem;display:flex;flex-direction:column;gap:12px}
.ai-empty b{font-family:var(--serif);font-size:1.1rem;color:var(--text)}
.ai .chip{font-size:.8rem}
.set{width:100%;max-width:520px;background:var(--surf);border:1px solid var(--line3);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
.set .mb{gap:14px}
.set h2{font-size:1.3rem}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;font-family:var(--mono)!important}
.okline{font-size:.8rem;color:var(--green)}
@media (max-width:640px){.ai-fab span{display:none}.ai-fab{padding:12px 14px}}
@media print{.ai,.ai-fab{display:none!important}}
/* loading, table view, print */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:90px 20px;color:var(--muted);font-family:var(--serif);font-style:italic}
.loading::before{content:'';width:34px;height:34px;border-radius:50%;border:3px solid var(--line3);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surf);border:0;padding:7px 10px;font-size:.8rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--goldbg);color:var(--gold2)}
table.t.list tbody tr{cursor:pointer}
table.t.list td{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t.list td:first-child{font-weight:600;color:var(--text)}
@media print{
  body{overflow:visible;height:auto;background:#fff;color:#000}
  .top,.tabs,.sb,.ctrl,.mact,.mnav,.scrim,.more,.toast,#pbg{display:none!important}
  .ws,.main,.content{display:block;overflow:visible;height:auto}
  .mbg.open{position:static;display:block;background:none;backdrop-filter:none;padding:0}
  body.mopen .ws{display:none}
  .card,.panel,.rule,.tool,.modal{box-shadow:none;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

  ov.classList.add('on');ov.classList.toggle('spin',!reduce);
  if(!reduce){const spans=[...ov.querySelectorAll('.die span')];const t0=performance.now();const tick=now=>{const k=(now-t0)/900;spans.forEach(sp=>{sp.textContent=k<1?1+Math.floor(Math.random()*sides):sp.dataset.final});if(k<1)requestAnimationFrame(tick);else ov.classList.remove('spin')};requestAnimationFrame(tick)}

function diceify(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('input,textarea,select,button,a,.dice,script,style')?NodeFilter.FILTER_REJECT:(DICE_RX.lastIndex=0,DICE_RX.test(n.nodeValue))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP});const ns=[];while(w.nextNode())ns.push(w.currentNode);

  if(SITE&&tab!==SITE.page){location.href=pageUrl(tab)+'#/'+tab+(setup?'?s='+encodeURIComponent(JSON.stringify(setup)):'');return}
  if(setup&&VIEWS[tab]){const s=st(tab);Object.assign(s,{q:'',side:'',f:{},tg:{},shown:60},setup)}
  history.pushState(null,'',hashFor(tab));$('content').dataset.tab='';route();
  $('content').scrollTop=0;
}
function route(){
  const {tab,type,name,params}=parseHash();
  const valid=TABS.some(x=>x[0]===tab);
  if(SITE&&valid&&tab!==SITE.page){location.replace(pageUrl(tab)+location.hash);return}
  const t=SITE?SITE.page:valid?tab:'home';
  const setup=params.get('s');
  if(setup&&VIEWS[t]){try{Object.assign(st(t),{q:'',side:'',f:{},tg:{},shown:60},JSON.parse(setup))}catch(e){}history.replaceState(null,'',hashFor(t));$('content').dataset.tab=''}
  if(t!==TAB||!$('content').dataset.tab||$('content').dataset.tab!==t){TAB=t;renderTab()}
  if(type&&TYPES[type]){
    const arr=TYPES[type].arr;
    const x=arr.find(y=>y.n===name)||arr.find(y=>lc(y.n)===lc(name))||arr.find(y=>lc(y.n.split(' - ')[0].trim())===lc(name));
    if(x){if(!MODAL_LIST.includes(x)&&LIST.includes(x))MODAL_LIST=LIST;showModal(x)}else hideModal();
  } else hideModal();
}

function sideCounts(V){
  if(V._counts)return V._counts;
  const c={},sc={};
  V.arr.forEach(x=>{const k=x[V.side.key]||'Other';c[k]=(c[k]||0)+1;if(V.side.sub&&x[V.side.sub]&&x[V.side.sub]!==k){const s=k+'|'+x[V.side.sub];sc[s]=(sc[s]||0)+1}});
  return V._counts={c,sc};
}
function renderSidebar(){
  const V=VIEWS[TAB],s=st(TAB),{c,sc}=sideCounts(V);
  let keys=Object.keys(c);
  if(V.side.order)keys.sort((a,b)=>{const i=V.side.order.indexOf(a),j=V.side.order.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});else keys.sort();
  const top=s.side.split('|')[0];
  let h=`<div class="sb-h">${V.side.label}</div><button class="sb-i${s.side?'':' on'}" data-side="">All<span class="c">${fmt(V.arr.length)}</span></button><div class="sb-sep"></div>`;
  keys.forEach(k=>{
    h+=`<button class="sb-i${s.side===k?' on':''}" data-side="${esc(k)}">${V.side.color?`<span class="dot" style="background:${rcol(k)}"></span>`:''}${esc(k)}<span class="c">${fmt(c[k])}</span></button>`;
    if(V.side.sub&&top===k){
      Object.keys(sc).filter(x=>x.startsWith(k+'|')).sort().forEach(x=>{h+=`<button class="sb-i sub${s.side===x?' on':''}" data-side="${esc(x)}">${esc(x.split('|')[1])}<span class="c">${fmt(sc[x])}</span></button>`});
    }
  });
  $('sb').innerHTML=h;$('sb').hidden=false;
}
$('sb').addEventListener('click',e=>{const b=e.target.closest('[data-side]');if(!b)return;const s=st(TAB);s.side=b.dataset.side;s.shown=60;renderSidebar();renderList();updateActive();if(innerWidth<=900)toggleDrawer(false)});

    return `<select class="sel${s.f[f.id]?' set':''}" data-f="${f.id}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}</option>${o.map(([v,l])=>`<option value="${esc(v)}"${s.f[f.id]===v?' selected':''}>${esc(l)}</option>`).join('')}</select>`}).join('');
  const tg=V.toggles.map(t=>`<button class="btn${s.tg[t.id]?' on':''}" data-tg="${t.id}" aria-pressed="${!!s.tg[t.id]}">${t.label}</button>`).join('');
  const so=V.sorts.length>1?`<select class="sel" data-sort aria-label="Sort">${V.sorts.map(([id,l])=>`<option value="${id}"${s.sort===id?' selected':''}>Sort: ${l}</option>`).join('')}</select>`:'';

function updateActive(){
  const V=VIEWS[TAB],s=st(TAB),a=[];
  if(s.side)a.push(['side:',V.side.label+': '+s.side.replace('|',' › ')]);
  V.filters.filter(f=>f.hidden&&s.f[f.id]).forEach(f=>a.push(['f:'+f.id,f.chip(s.f[f.id])]));
  const n=Object.values(s.f).filter(Boolean).length+Object.values(s.tg).filter(Boolean).length+(s.q?1:0)+(s.side?1:0);
  const el=$('act');if(!el)return;
  el.innerHTML=a.map(([k,l])=>`<span class="achip">${esc(l)}<button data-rm="${k}" aria-label="Remove filter">×</button></span>`).join('')+(n>1?`<button class="btn" data-reset style="padding:2px 10px;font-size:.75rem">Clear all</button>`:'');
}
function filtered(){
  const V=VIEWS[TAB],s=st(TAB);
  const words=lc(s.q).split(/\s+/).filter(Boolean);
  const [side,sub]=s.side.split('|');
  const fs=V.filters.filter(f=>s.f[f.id]),ts=V.toggles.filter(t=>s.tg[t.id]);
  let out=V.arr.filter(x=>{
    if(side&&(x[V.side.key]||'Other')!==side)return false;
    if(sub&&x[V.side.sub]!==sub)return false;
    for(const f of fs)if(!f.test(x,s.f[f.id]))return false;
    for(const t of ts)if(!t.test(x))return false;
    if(words.length){const h=x._h||(x._h=lc(V.hay(x)));for(const w of words)if(!h.includes(w))return false}
    return true;
  });
  const so=V.sorts.find(x=>x[0]===s.sort);
  if(words.length){const w0=words.join(' ');const score=x=>{const n=lc(x.n);return n===w0?0:n.startsWith(w0)?1:n.includes(w0)?2:3};out=out.map(x=>[score(x),x]).sort((a,b)=>a[0]-b[0]||(so&&so[2]?so[2](a[1],b[1]):0)).map(x=>x[1])}
  else if(so&&so[2])out.sort(so[2]);
  return out;
}
let io;

  if(io)io.disconnect();

function recentAdd(x){if(!x||!x._t||x._t==='note'&&!x.n)return;const k=x._t+'|'+x.n;let r=store.get('recent',[]).filter(z=>z!==k);r.unshift(k);store.set('recent',r.slice(0,16))}
function recentItems(){return store.get('recent',[]).map(k=>{const [t,...rest]=k.split('|'),n=rest.join('|'),T=TYPES[t];return T&&T.arr.find(y=>y.n===n)}).filter(Boolean)}
function showModal(x){

  const i=MODAL_LIST.indexOf(x);
  const nav=i>=0&&MODAL_LIST.length>1?`<div class="mnav"><button class="btn" onclick="step(-1)" ${i===0?'disabled':''}>← Previous</button><span class="pos">${fmt(i+1)} / ${fmt(MODAL_LIST.length)}</span><button class="btn" onclick="step(1)" ${i===MODAL_LIST.length-1?'disabled':''}>Next →</button></div>`:'';

  document.title=x.n.split(' - ')[0]+' · FAND';

const PART_PROF={B:'Scavenging',F:'Scavenging',L:'Scavenging',E:'Scavenging (essences fade within an hour unless bottled)',W:'Harvesting',K:'Engineering salvage'};
function monsterLore(m){
  const L=LORE[m.body]||LORE.beast,h=hashStr(m.n),f=s=>s.replace(/\{n\}/g,m.n).replace(/\{realm\}/g,m.realm);
  const b=m.sb||{},out=[];
  out.push(['Overview',`${m.n} is a ${(b.sz||'').toLowerCase()} ${b.ty||m.body} of the ${m.realm} (grade ${m.g}, challenge ${b.cr||m.cr}). ${m.txt||''}`]);
  out.push(['Appearance',f(L.look[h%L.look.length])]);
  const tac=[f(L.act)];
  if(b.ac2&&b.ac2.some(a=>/Breath/.test(a[0])))tac.push('It saves its breath weapon for clustered foes and uses it again the moment it recharges.');
  if(b.ac2&&b.ac2.some(a=>/Mind Blast/.test(a[0])))tac.push('It opens with a psychic blast to stun the most dangerous foes before closing in.');
  if(b.ac2&&b.ac2.some(a=>/Ranged/.test(a[1])))tac.push('It prefers to fight at range and keeps its distance from heavily armored foes.');
  if(b.lg)tac.push('As a legendary creature, it acts between its foes\' turns and shrugs off spells that would end a lesser monster. Treat it as a boss.');
  if(b.ac>=6)tac.push(`Its AC of ${b.ac} blunts weak blows entirely: small hits do nothing. Bring heavy weapons or spells.`);
  else if(b.ac===0)tac.push('It has no armor to speak of, so every hit lands in full.');
  out.push(['Behavior and Tactics',tac.join(' ')]);
  out.push(['Habitat and Ecology',(m.hab?`Found in ${m.hab.toLowerCase()}. `:'')+f(L.eco)]);
  out.push(['Society',f(L.soc)]);
  const parts=(m.drops||[]).map(d=>findMat(d[0])).filter(Boolean);
  if(parts.length){
    const by={};parts.forEach(x=>{const p=PART_PROF[matCode(x)]||'Scavenging';(by[p]=by[p]||[]).push(x)});
    const val=parts.reduce((a,x)=>a+(x.price||0),0);
    out.push(['Harvesting',`A careful harvester can take ${parts.length} parts from its body, worth about ${gp(val)} in all${CURRENCY[m.realm]&&CURRENCY[m.realm].coin&&CURRENCY[m.realm].gp>1?` (${localPrice(val,m.realm)})`:''}. `+Object.entries(by).map(([p,xs])=>`${p}: ${xs.map(x=>x.n.replace(m.n+' ','').toLowerCase()).join(', ')}.`).join(' ')+(parts.some(x=>matCode(x)==='L')?' Blood and organs spoil within a day unless salted, iced, or bottled.':'')]);
  }
  const r=REALM[m.realm],gods=[...new Set(parts.flatMap(x=>GOD_BY_MAT.get(lc(x.n))||[]))];
  const kin=MONSTERS.filter(x=>x!==m&&x.realm===m.realm&&Math.abs(x.g-m.g)<=1).sort((a,c)=>hashStr(m.n+a.n)-hashStr(m.n+c.n)).slice(0,4);
  out.push(['In FAND',`${m.realm} has a Pressure of ${r?r.pressure:'?'}; travelers with lower Attunement suffer strain while hunting it.`+(CURRENCY[m.realm]&&CURRENCY[m.realm].coin?` Its parts trade for ${CURRENCY[m.realm].pl} there.`:' Its parts are not sold; they are traded by favor and contract.')+(gods.length?` The gods ${gods.map(godKey).join(', ')} prize its parts as signature materials.`:'')+(kin.length?` It is often found near ${kin.map(x=>x.n).join(', ')}.`:'')]);
  out.push(['Adventure Hook',f(L.hook)]);
  return out;
}

function mdVault(src){
  const inline=s=>esc(s.replace(/(^|[^/\w])Atrious\b(?!\/)/g,'$1Vestige')).replace(/!\[\[[^\]]*\]\]/g,'').replace(/\[\[([^\]|]+)(?:\\?\|([^\]]+))?\]\]/g,(m,t,a)=>{const label=a||t.split('/').pop().replace(/#.*$/,'');const x=resolveLink(t.replace(/&amp;/g,'&').replace(/&#39;/g,"'"));return x?`<a href="#" data-ref="${ref(x)}">${label}</a>`:`<span style="color:var(--muted)" title="Not on the website">${label}</span>`})

    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/==([^=]+)==/g,'<mark>$1</mark>');
  const L=String(src||'').split('\n');let out='',i=0;
  while(i<L.length){
    let l=L[i];
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      const row=x=>x.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim());
      const head=row(l);i+=2;const body=[];while(i<L.length&&/^\s*\|/.test(L[i])){body.push(row(L[i]));i++}
      out+=`<div class="tablewrap" style="margin:10px 0"><table class="t"><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c.replace(/\\\|/g,'|'))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue;
    }
    if(/^>/.test(l)){const q=[];while(i<L.length&&/^>/.test(L[i])){q.push(L[i].replace(/^>\s?/,''));i++}let title='';const m=/^\[!(\w+)\][-+]?\s*(.*)$/.exec(q[0]||'');if(m){title=m[2]||m[1];q.shift()}out+=`<div class="callout" style="margin:10px 0">${title?`<b>${inline(title)}</b><br>`:''}${q.map(inline).join('<br>')}</div>`;continue}
    let m;
    if((m=/^(#{1,6})\s+(.*)/.exec(l))){const lv=m[1].length;out+=lv<=1?'':`<h${Math.min(5,lv+2)} style="font-family:var(--serif);margin:16px 0 6px;color:var(--text)">${inline(m[2])}</h${Math.min(5,lv+2)}>`;i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out+='<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">';i++;continue}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){const ord=/^\s*\d/.test(l);let h=ord?'<ol>':'<ul>';while(i<L.length&&/^\s*([-*+]|\d+[.)])\s+/.test(L[i])){const ind=(/^\s*/.exec(L[i])[0].length);h+=`<li style="margin-left:${ind*6}px">${inline(L[i].replace(/^\s*([-*+]|\d+[.)])\s+(\[[ x]\]\s*)?/,''))}</li>`;i++}out+=h+(ord?'</ol>':'</ul>');continue}
    if(!l.trim()){i++;continue}
    const para=[];while(i<L.length&&L[i].trim()&&!/^(#|>|\s*\||\s*([-*+]|\d+[.)])\s)/.test(L[i])){para.push(L[i]);i++}
    out+=`<p>${para.map(inline).join('<br>')}</p>`;
  }
  return out;
}

const PAL_ORDER=[['rune','Runes'],['note','Codex'],['bp','Blueprints'],['mat','Materials'],['mon','Bestiary'],['god','Gods'],['realm','Realms'],['sub','Subclasses'],['demon','Demons'],['patron','Patrons'],['spell','Spells']];

function paletteSearch(){
  const q=lc($('pq').value.trim()).replace(/infinitas/g,'infinatas');
  PRES=[];let h='';
  if(!q){
    const pins=pinnedItems().slice(0,8);
    const jump=TABS.filter(t=>t[0]!=='home');
    if(pins.length){h+=`<div class="pal-g">Pinned</div>`;pins.forEach(x=>{PRES.push({x});h+=palRow(x,esc(x.n),PRES.length-1)})}
    const rec=recentItems().filter(x=>!pins.includes(x)).slice(0,6);if(rec.length){h+=`<div class="pal-g">Recently viewed</div>`;rec.forEach(x=>{PRES.push({x});h+=palRow(x,esc(x.n),PRES.length-1)})}

  } else {
    const best=[];PAL_ORDER.forEach(([t])=>{const arr=TYPES[t].arr;for(const x of arr){const n=lc(x.n),k=lc(x.n.split(' - ')[0]);if(n===q||k===q){best.push(x);if(best.length>=4)break}}});
    const bestSet=new Set(best);
    if(best.length){h+=`<div class="pal-g">Best match</div>`;best.forEach(x=>{PRES.push({x});h+=palRow(x,hl(x.n,q),PRES.length-1)})}
    PAL_ORDER.forEach(([t,label])=>{
      const arr=TYPES[t].arr,hits=[];
      for(let i=0;i<arr.length&&hits.length<60;i++){if(bestSet.has(arr[i]))continue;const n=lc(arr[i].n);const k=n.indexOf(q);if(k>=0)hits.push([k===0?0:n.includes(' '+q)?1:2,arr[i]])}
      if(!hits.length)return;
      hits.sort((a,b)=>a[0]-b[0]||a[1].n.length-b[1].n.length);
      h+=`<div class="pal-g">${label}</div>`;
      hits.slice(0,t==='spell'?4:6).forEach(([,x])=>{PRES.push({x});h+=palRow(x,hl(x.n,q),PRES.length-1)});
    });
    if(!SP.length&&META.counts.spells){PRES.push({tab:'spells',setup:{q:$('pq').value.trim()}});h+=`<div class="pal-g">Spells</div><button class="pal-i" data-pi="${PRES.length-1}">Search ${fmt(META.counts.spells)} spells for “${esc($('pq').value.trim())}”<span class="r">Spells page →</span></button>`}

}
function palRow(x,label,i){

function palMark(){$('pres').querySelectorAll('.pal-i').forEach(b=>b.classList.toggle('sel',+b.dataset.pi===PSEL));const s=$('pres').querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'})}

function realmRoute(a,b){

        <div><div class="blk"><h4>Examples by level</h4></div><div class="mlist">${lvs.map(b=>`<button data-ref="${ref(b)}"><b style="width:44px;color:var(--gold2)">Lv ${b.lv}</b>${esc(b.n)}<span class="r">${esc(b.cat)}</span></button>`).join('')}</div></div>
      </div>`}).join('')}</div>

function renderRules(){

  const S=[
    ['ac','Armor Class','',`<ul><li>Armor Class starts at <b>0</b>.</li><li>Armor and other gear each add a small amount of AC to your total.</li><li>Armor that gives more AC comes with drawbacks. For example, full iron gear gives <b>+10 AC</b>, but you lose Acrobatics, Athletics, and Dexterity.</li></ul>
      <div class="formula">damage taken = damage − AC</div>
      <p><b>How much AC gear gives.</b> Each slot is worth armor units: Body 4, Head 2, Hands 1, Feet 1, Shoulders 1, Back 1 (a full set is 10). Shields: Buckler 1, Shield 2, Tower 3. Each unit gives 1 AC in metal, 0.7 in bone, scale, or stone, and 0.4 in hide or cloth, raised by the material's Item Level (×(1 + (Item Level − 1) ÷ 20)). A full set of iron gear gives <b>10 AC</b>. Every piece gives at least 1.</p>
      <p>AC is subtracted flat from the total damage of each hit.</p>

      <div class="tablewrap"><table class="t"><thead><tr><th>Piece</th><th>Heavy (metal)</th><th>Medium (bone, scale, stone)</th><th>Light</th></tr></thead><tbody>${['Body','Head','Hands','Feet','Shoulders','Back','Shield','Tower','Mount'].map(sl=>`<tr><td><b>${sl==='Tower'?'Tower shield':sl==='Mount'?'Barding (mount)':sl}</b></td>${['Heavy','Medium','Light'].map(w=>`<td>${esc(((PIECE_DRAWBACKS[sl]||{})[w]||['None']).join('; '))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p><b>Full sets.</b> ${SET_DRAWBACKS.map(x=>esc(x[2])).join(' ')} A set counts the armor units of Body, Head, Hands, Feet, Shoulders, and Back (8 of the 10). Bucklers and enhancements never add drawbacks.</p>
      <p class="note"><a href="${pageUrl('tools')}" data-go="tools">Damage calculator →</a></p>`],
    ['grading','Material Grading','v1.07, v1.10',`<p>Every material has a realm and a grade from 1 to 10. Together they give a Material Rank from 1 to 100, which sets the Item Level (1–50) of what it makes. Blueprints record their strongest material.</p>
      <div class="formula">Material Rank = (tier − 1) × 10 + grade<br>Item Level = ⌈ Rank ÷ 2 ⌉</div>${tierTable()}`],
    ['props','Material Properties','v1.13, v1.18',`<p>Every material gives one property (supplies give none). Strength scales with Potency 1–10, and grade 9–10 materials get a boost. Weapons, armor, and shields carry the property of their strongest material.</p>
      <div class="formula">Potency = min(10, max(1, ⌊Item Level ÷ 5⌋) + 1 at grade 9, + 2 at grade 10)</div>
      <details class="fold"><summary>All ${Object.keys(props).length} properties in the data</summary><div class="tablewrap"><table class="t"><thead><tr><th>Property</th><th class="num">Materials</th><th>Example text</th></tr></thead><tbody>${Object.entries(props).sort((a,b)=>b[1].n-a[1].n).map(([n,p])=>`<tr><td><a href="#" data-go="materials" data-setup='${esc(JSON.stringify({f:{pn:n}}))}' style="font-weight:600;text-decoration:none">${esc(n)}</a></td><td class="num">${p.n}</td><td style="color:var(--text2)">${esc(p.txt)}</td></tr>`).join('')}</tbody></table></div></details>`],
    ['refining','Material Refining','v1.17',`<ul><li>Three materials of one grade refine into one of the next grade.</li><li>Moving up to the next realm takes five materials, a binding agent, and a Realm Forge.</li></ul><p class="note"><a href="${pageUrl('tools')}" data-go="tools">Refining planner →</a></p>`],
    ['custom','Custom Blueprints','v1.07',`<p>Players design their own items from a primary material and up to two secondaries, then pass a design check. The item's traits come from its materials' properties. Player-made items go in the vault's <code>Blueprints/Custom/</code> folder, from its template.</p>`],
    ['economy','Economy','v1.20',`<div class="formula">price = realm base × grade   (×2 at grade 9–10; supplies cost ⅕)</div>
      <p>Each realm has its own coin; see the table below. Moneychangers take ${EXCHANGE_FEE*100}% to swap coin between realms.</p>${moneyTable()}
      <ul style="margin-top:12px"><li>Merchants buy at half price.</li><li>Void-grade materials and above aren't sold; they pass only between gods and their Fingers.</li><li>Where to buy and sell, Blueprint prices, crafting labor, services, and contract tithes are in the full Economy rules below.</li></ul>
      <div class="tablewrap"><table class="t"><thead><tr><th>Realm</th><th class="num">Base</th><th class="num">Grade 1</th><th class="num">Grade 5</th><th class="num">Grade 10</th></tr></thead><tbody>${REALMS.map(r=>`<tr><td>${esc(r.n)}</td><td class="num">${r.base?gp(r.base):'—'}</td><td class="num">${r.base?gp(r.base):'not sold'}</td><td class="num">${r.base?gp(r.base*5):'—'}</td><td class="num">${r.base?gp(r.base*20):'—'}</td></tr>`).join('')}</tbody></table></div>`],
    ['professions','Professions & Progression','v1.20–1.23',`<ul><li>Ten professions; every Blueprint has a profession and a specialty.</li><li>You start with one specialty and gain more over time. Crafting outside your specialties is at disadvantage, and each specialty has its own requirement.</li><li>Hell, Heaven, and Void metals need a Blacksmith with the matching realm specialty.</li><li>Profession XP comes from crafting, designing, refining, and gathering, with teachers and milestones.</li><li><b>Harvesting</b> gathers ore, stone, crystal, and plants. <b>Scavenging</b> strips hide, bone, blood, organs, and essences from corpses.</li></ul><p class="note"><a href="${pageUrl('professions')}" data-go="professions">All professions →</a></p>`],
    ['travel','Realm Travel','v1.17',`<ul><li>Each realm has a <b>Pressure</b> from 0 to 9. A traveler's <b>Attunement</b> comes from their level, contract rank, or realm-material gear.</li><li>If Pressure is higher than Attunement, the traveler suffers strain.</li><li>There are 11 travel methods, and an anchor from home makes the return trip easier.</li></ul><p class="note">Pressure: Human 0, Mysterious 1, Hell and Heaven 2, Chaos 3, Abyss 4, Inner 5, Outer 6, Void 7, Inner Void 8, Primordial 9. Attunement is the highest of: level ÷ 4, contract rank ÷ 2 (Minor 1 up to 1st Finger 10), or the Potency of worn gear made from that realm's material. Strain (Pressure − Attunement): 1 disadvantage on Con saves; 2 also 1 exhaustion per day; 3 also no long rests; 4+ 1 exhaustion every hour.</p>`],
    ['levels','Stages: levels, class changes, and professions','campaign rules',`<ul><li><b>Every 10 levels is a stage</b>, and each stage belongs to a realm tier. Levels 1–10 are a character's original class (Human). At <b>level 11</b> they change into a stronger <b>2nd version</b> of their class, then change again every 10 levels: the 3rd change at 21, the 4th at 31, up to the <b>10th change at 91</b>. The highest level is 100.</li><li>Each change unlocks the magic of the next realm tier: the 2nd change lets a character use <b>Mysterious Realm</b> spells, the 3rd <b>Hell</b> (the demon realm) and <b>Heaven</b> spells, then Chaos, Abyss, Inner Realm, Outer Realm, Void, Inner Void, and finally the Primordial.</li><li>A spell's realm is the home realm of the god who holds its Rune. Spells of an unclaimed Rune belong to the realm whose Tower that Rune feeds. Spells with no Rune are Human-realm magic anyone can learn. The Spells page shows each spell's realm and can filter by it.</li><li><b>Professions use the same stages.</b> Blacksmithing levels 1–10 are its Human stage, 11–20 its Mysterious stage, and so on to 91–100. A crafter can only work materials from realms their profession stage has reached (a Hell 6 ingot needs a profession stage of 3, level 21+). The same goes for harvesting and scavenging: parts from a deeper realm than your stage are taken at disadvantage.</li><li><b>Towers</b> start at their realm's stage: the Human Tower's first floors are level 1, the Mysterious Tower's level 11, Hell's and Heaven's level 21, and so on.</li><li><i>Website proposals, adjust as you like:</i> past level 20 each change adds one spell slot at every spell level the class already has; encounter budgets keep growing about 12% a level; monsters top out at CR 30; the profession bonus stays half the profession level.</li></ul>
      <div class="tablewrap"><table class="t"><thead><tr><th>Stage</th><th>Levels (class or profession)</th><th>Realm of magic and materials</th></tr></thead><tbody>${Array.from({length:10},(_,i)=>i+1).map(k=>`<tr><td>${k===1?'Stage 1: original class':'Stage '+k+': '+ORDN(k)+' change'}</td><td>${stageStart(k)}–${stageEnd(k)}</td><td>${esc(TIER_NAMES(k))}</td></tr>`).join('')}</tbody></table></div>
      ${Object.keys(STAGES).length?`<details class="fold"><summary>Every class's changes</summary><div class="tablewrap"><table class="t"><thead><tr><th>Class</th>${Array.from({length:9},(_,i)=>`<th>${ORDN(i+2)}</th>`).join('')}</tr></thead><tbody>${Object.entries(STAGES).map(([cl,L])=>`<tr><td><b>${esc(cl)}</b></td>${L.map(x=>`<td title="${esc(x.blurb||'')}">${esc(x.name)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${Object.entries(STAGES).map(([cl,L])=>`<details class="fold"><summary>${esc(cl)}: the full path</summary>${L.map(x=>`<div style="margin:8px 0"><b>${esc(x.name)}</b> <span class="note" style="margin:0">${ORDN(x.stage)} change · levels ${esc(x.levels)} · ${esc(x.realm)} magic</span><div style="color:var(--text2)">${esc(x.blurb||'')}</div>${x.trial?`<div class="note" style="margin:2px 0">Trial: ${esc(x.trial)}</div>`:''}<ul style="margin:4px 0 0 18px">${(x.features||[]).map(([lv,n,t])=>`<li><b>Lv ${lv} ${esc(n)}</b>: ${esc(t)}</li>`).join('')}</ul></div>`).join('')}</details>`).join('')}</div></details>`:''}`],
    ['contracts','God Contracts','v1.08, v1.15',`<ul><li>The gods are guests in Vestige: their own world eroded because of Inane, and Infinatas, who cares only for balance, let them in under strict regulation.</li><li>Ten ranks, from Minor up to 1st Finger. The five Fingers (one holder each) form the god's Hand.</li><li><b>Spells</b> from a contract are extra spells from the god's Law; you can cast them even if your class can't, using your slots, or once per long rest each if you have none.</li><li><b>Natural AC</b> from a contract can't be looted, and replaces the previous rank's bonus rather than stacking.</li></ul>${contractTable(null)}<p class="note">Open a god to see this table with that god's own signature materials and Finger relic.</p><h4 style="margin:14px 0 6px">Duties, rising, and breaking a contract</h4><div class="tablewrap"><table class="t"><thead><tr><th>Rank</th><th>Duties</th><th>To reach this rank</th><th>If you break it</th></tr></thead><tbody>${CONTRACTS.map(c=>`<tr><td style="white-space:nowrap"><b>${c.r}</b></td><td>${esc(c.duty)}</td><td>${esc(c.rise||'Sign the contract')}</td><td>${esc(c.brk)}</td></tr>`).join('')}</tbody></table></div><ul><li><b>Several gods at once.</b> A character can hold contracts with several gods at any rank. When there is a conflict of interest (two of their gods are rivals, or one's orders work against another's), they must choose a side and suffer the consequences: the contract they abandon is broken, with the costs in the table above. Contractors of rival gods are fair game for each other. <i>(This replaces the vault's older rule that Major contracts and above are exclusive.)</i></li><li><b>When a god dies,</b> its contracts become void at your next long rest, its power breaks into Runes, and a Finger who reaches the remains first may claim a Primary piece: the first step toward godhood.</li><li>${CONTESTED.length} Runes are held by more than one god; those gods are rivals.</li></ul><p class="note"><a href="${pageUrl('gods')}" data-go="gods">All gods →</a></p>`],
    ['classes','Classes & Subclasses','v1.03, v1.18',`<ul><li>Official subclasses from the Player's Handbook, Xanathar's, Tasha's, and the Sword Coast guide are included as paraphrased summaries, each labeled with its source book.</li><li>Three 2024 Player's Handbook subclasses were added: Path of the World Tree, College of Dance, and Circle of the Sea.</li><li>Each class page notes which of its subclasses the 2024 Player's Handbook revised. Every class picks its subclass at level 3.</li><li>Homebrew Rune subclasses sit alongside the official ones.</li></ul><p class="note"><a href="${pageUrl('subclasses')}" data-go="subclasses">All subclasses →</a></p>`],
    ['spells','Spells','v1.17, v1.23',`<ul><li>Every spell in the vault lists its classes. Pyramid spells get them from their school, plus the class tied to their Rune where one applies.</li><li>73 Tertiary and Secondary damage spells were turned into support spells: they now heal, cure, ward, shield, teleport, or otherwise help. Each was renamed to match its new effect and scales with spell level.</li></ul><p class="note">${META.counts.spells<10000?`The Spells page shows the vault's ${fmt(META.counts.spells)} spells.`:`The vault has about 2,330 spells. The Spells page in this app holds an older, larger generated list (${fmt(META.counts.spells)}); run the vault import to replace it.`}</p>`],
    ['monsters','Monster Stats','v1.20',`<ul><li><b>Homebrew</b> monsters have a level, HP, AC, attacks, a save DC, and a signature trait from their best drop. Grade 10 monsters have boss rules.</li><li><b>Official</b> monsters have their CR, a grade from that CR, an original short description, and graded drops; no stat blocks.</li><li><b>Monster AC scales through the realms</b> (campaign rule): half the CR, plus natural armor, plus 1 for each realm tier past the Human Realm, plus 1 for every 5 grades within the realm. A Human-realm CR 1 monster has AC 0 to 2; a grade-10 Primordial monster reaches the high 20s, matching the damage of Primordial-grade weapons.</li><li><b>Monster HP and damage scale too</b>: +15% HP for each realm tier past the Human Realm, and a flat bonus on every hit of about +2.5 per tier, which keeps pace with the AC that gear of that realm gives (a Primordial monster's hits carry +23). Breath weapons grow 10% per tier.</li></ul>`],
  ];
  $('content').innerHTML=`<div class="page rules"><nav class="toc">${S.map(([id,t])=>`<a href="#rule-${id}" onclick="document.getElementById('rule-${id}').scrollIntoView();return false">${t}</a>`).join('')}</nav>
    <div>${S.map(([id,t,v,body])=>`<section class="rule" id="rule-${id}"><h3>${t}</h3><div class="src">Rules summary${v?' · '+v:''}${RULE_NOTES[id]?' · full vault text below':''}</div>${body}${ruleVault(id)}</section>`).join('')}</div></div>`;
}

const SHOP_KINDS=[['smith','Smithy and armorer'],['bowyer','Bowyer and woodworker'],['tanner','Tanner and tailor'],['alch','Alchemist and herbalist'],['jewel','Jeweler and gem cutter'],['arcane','Arcane curios'],['butcher','Monster-parts dealer'],['general','General store']];
const SHOP_STOCK={smith:{cats:['O','S'],bp:['Blacksmithing'],gens:/Axe|Sword|Dagger|Hammer|Spear|Cuirass|Helm|Gauntlets|Boots|Shield|Mace|Pike|Halberd|Glaive|Flail|Maul|Pick|Rapier|Scimitar|Morningstar/},
  bowyer:{cats:['W'],bp:['Carving'],gens:/Bow|Crossbow|Quarterstaff|Staff|Club|Spear|Javelin|Dart|Shield/},tanner:{cats:['F'],bp:['Tailoring'],gens:/Cloak|Boots|Gauntlets|Cuirass|Whip|Sling|Net/},
  alch:{cats:['L','W'],bp:['Alchemy'],cat:/Potion/},jewel:{cats:['G'],bp:['Enchanting'],gens:/Ring|Amulet|Orb/},arcane:{cats:['E','G'],bp:['Enchanting'],gens:/Wand|Orb|Staff|Amulet|Ring/},
  butcher:{cats:['B','L','F'],bp:[],harvest:true},general:{cats:['U','W','F','O'],bp:['Cooking','Engineering','Navigation','Harvesting'],cat:/Tool|Food|Map|Instrument/}};
function rollShop(realm,kind,size,seed){
  const R=rng32(seed),K=SHOP_STOCK[kind],r=REALM[realm];if(!r||!r.base)return null;
  const maxG=[0,3,5,7,10][size],nMat=[0,5,8,11,14][size],nBp=[0,2,4,6,8][size];
  const pool=MATS.filter(m=>m.realm===realm&&m.price&&m.g<=maxG&&K.cats.includes(matCode(m))&&(K.harvest?true:!m.gen)&&!(m.tier>=8));
  const pick=(arr,n)=>{const a=arr.slice(),o=[];while(a.length&&o.length<n){o.push(a.splice(Math.floor(R()*a.length),1)[0])}return o};
  const staple=K.harvest?pool:pool.filter(m=>m.org!=='Creature'),rest=pool.filter(m=>!staple.includes(m));
  const chosen=pick(staple,nMat);if(chosen.length<nMat)chosen.push(...pick(rest,nMat-chosen.length));
  const mats=chosen.sort((a,b)=>a.g-b.g||byName(a,b)).map(m=>({m,q:1+Math.floor(R()*(m.g<=3?8:m.g<=6?4:2)),price:Math.round(m.price*(0.85+R()*0.3))}));
  const bps=pick(BPS.filter(b=>b.lv<=maxG*2&&(K.bp.includes(b.pr)||(K.gens&&genOf(b)&&K.gens.test(genOf(b)))||(K.cat&&K.cat.test(b.cat)))&&b.mats.every(n=>{const m=findMat(n);return !m||m.realm===realm||(REALM[m.realm]||{}).tier<=r.tier})),nBp)
    .map(b=>{const cost=b.mats.reduce((a,n)=>a+((findMat(n)||{}).price||0),0);return {b,price:Math.max(5,Math.round((cost*1.5+b.lv*15)*(0.85+R()*0.3)/5)*5)}}).sort((a,b)=>a.b.lv-b.b.lv);
  return {mats,bps};
}
// Stages (campaign owner's rules): every 10 levels is a stage. Levels 1-10 are a character's original class; at 11
// they change into a stronger 2nd version, then change again every 10 levels (21, 31, ... 91), up to level 100. Each
// stage unlocks the next realm tier: the 2nd change Mysterious Realm magic, the 3rd Hell and Heaven, ... the 10th the
// Primordial. Professions follow the same stages: a crafter works the materials of realms their stage has reached.
const MAX_LEVEL=100;
const stageOf=lv=>Math.max(1,Math.min(10,Math.ceil((+lv||1)/10)));
const stageStart=k=>(Math.max(1,k)-1)*10+1;
const stageEnd=k=>Math.max(1,k)*10;
const ORDN=k=>k+(k===1?'st':k===2?'nd':k===3?'rd':'th');
const TIER_NAMES=t=>REALMS.filter(r=>r.tier===t).map(r=>r.n).join(' and ');
function stageInfo(cls,lv){const k=stageOf(lv),st=k>1&&typeof STAGES!=='undefined'&&STAGES[cls]?STAGES[cls].find(x=>x.stage===k):null;return {k,name:k===1?cls:(st?st.name:cls+' ('+ORDN(k)+' change)'),st,realms:REALMS.filter(r=>r.tier<=k).map(r=>r.n)}}
// A spell's realm: the home realm of the god holding its Rune (the most accessible one if several do); a Rune no god
// holds belongs to the realm whose Tower it feeds; a spell with no Rune is Human-realm magic open to everyone.
function spellRealm(s){
  if(s._realm!==undefined)return s._realm;
  const ru=s.rune&&RUNE_IDX.get(lc(s.rune));let realm='Human';
  if(ru){const homes=ru.gods.map(g=>REALM[g.home]).filter(Boolean).sort((a,b)=>a.tier-b.tier);if(homes.length)realm=homes[0].n;else{for(const [rn,list] of TOWER_RUNES)if(list.includes(ru)){realm=rn;break}}}
  return s._realm=realm;
}
const spellNeed=s=>(REALM[spellRealm(s)]||{tier:1}).tier;
// Spell slots, read from the vault's Spell Slots note (its tables: full casters, half casters, pact magic).
const CASTER={Bard:'full',Cleric:'full',Druid:'full',Sorcerer:'full',Wizard:'full',Paladin:'half',Ranger:'half',Artificer:'arti',Warlock:'pact'};
function slotTables(){if(slotTables.t)return slotTables.t;const n=noteByName('Spell Slots');if(!n)return null;const T=[];let cur=null;
  n.md.split('\n').forEach(l=>{if(/^\s*\|/.test(l)){if(/^\s*\|\s*-/.test(l))return;const c=l.split('|').slice(1,-1).map(x=>x.trim());if(!cur){cur={h:c,rows:[]};T.push(cur)}else cur.rows.push(c)}else cur=null});
  return slotTables.t={full:T[0],half:T[1],pact:T[2]}}
function slotsFor(cls,lv){const T=slotTables(),k=CASTER[cls];if(!T||!k)return null;const extra=lv>20?stageOf(lv)-2:0;lv=Math.max(1,Math.min(20,lv||1));
  if(k==='pact'){let row=null;T.pact.rows.forEach(r=>{if(+r[0]<=lv&&/\d/.test(r[1]))row=r});return row?{pact:true,n:+row[1]+extra,lvl:row[2],extra}:null}
  const t=k==='full'?T.full:T.half,L=k==='arti'?Math.min(20,lv+1):lv,row=t.rows.find(r=>+r[0]===L);if(!row)return null;

// Armor drawbacks come from what is actually worn: each piece's slot and the weight of its material
// (metal = heavy, bone/scale/stone/gem = medium, hide/cloth and the rest = light). Light armor never has drawbacks.
// A full heavy set (metal on 8+ armor units) keeps the campaign's rule: you lose Acrobatics, Athletics, and Dexterity.
const ARMOR_WEIGHT={O:'Heavy',B:'Medium',S:'Medium',G:'Medium'};
const weightOfCodes=codes=>codes.includes('O')?'Heavy':codes.some(c=>ARMOR_WEIGHT[c])?'Medium':'Light';
const PIECE_DRAWBACKS={
  Body:{Heavy:['Disadvantage on Dexterity (Stealth) checks','Speed −5 ft'],Medium:['Disadvantage on Dexterity (Stealth) checks']},
  Head:{Heavy:['Disadvantage on Wisdom (Perception) checks that rely on hearing or sight to the sides']},
  Hands:{Heavy:['Disadvantage on Dexterity (Sleight of Hand) checks and on fine work with tools'],Medium:['Disadvantage on Dexterity (Sleight of Hand) checks']},
  Feet:{Heavy:['Disadvantage on Dexterity (Stealth) checks (loud footsteps)']},
  Shoulders:{Heavy:['Disadvantage on Dexterity (Acrobatics) checks']},
  Back:{Heavy:['Disadvantage on Dexterity (Acrobatics) checks']},
  Mount:{Heavy:['The mount\'s speed −10 ft'],Medium:['The mount\'s speed −5 ft']},
  Tower:{Heavy:['Speed −5 ft','Disadvantage on Dexterity (Stealth) checks'],Medium:['Speed −5 ft'],Light:['Speed −5 ft']},
  Shield:{Heavy:['Disadvantage on Dexterity (Acrobatics) checks']},
};
const SET_DRAWBACKS=[['Heavy',8,'Full heavy set: you lose Acrobatics, Athletics, and Dexterity (Dexterity counts as 10 and you cannot use it for AC, attacks, or saves that would benefit).'],
  ['Medium',8,'Full medium set: disadvantage on Strength (Athletics) and Dexterity (Acrobatics) checks.']];
const SLOT_UNIT_ALL={Body:4,Head:2,Hands:1,Feet:1,Shoulders:1,Back:1,Enhancement:1,Mount:4,Buckler:1,Shield:2,Tower:3};
// piece: {slot, weight}
function pieceDrawbacks(pc){return ((PIECE_DRAWBACKS[pc.slot]||{})[pc.weight])||[]}
function armorPiece(b){const ms=(b.mats||[]).map(findMat).filter(Boolean);return {slot:b.slot||(b.cat==='Shield'?'Shield':'Body'),weight:weightOfCodes(ms.map(matCode)),n:b.n,b}}
function setDrawbacks(pieces){
  const out=[];pieces.forEach(pc=>pieceDrawbacks(pc).forEach(d=>{const x=out.find(o=>o.d===d);if(x)x.from.push(pc.n);else out.push({d,from:[pc.n]})}));
  const speed=out.filter(o=>/^Speed −(\d+)/.test(o.d));if(speed.length>1){const tot=speed.reduce((a,o)=>a+(+o.d.match(/\d+/)[0]),0);const from=speed.flatMap(o=>o.from);speed.forEach(o=>out.splice(out.indexOf(o),1));out.unshift({d:`Speed −${tot} ft`,from})}
  SET_DRAWBACKS.forEach(([w,min,d])=>{const u=pieces.filter(pc=>pc.weight===w||(w==='Medium'&&pc.weight==='Heavy')).filter(pc=>!['Mount','Enhancement','Buckler','Shield','Tower'].includes(pc.slot)).reduce((a,pc)=>a+(SLOT_UNIT_ALL[pc.slot]||0),0);
    if(u>=min&&!out.some(o=>/^Full heavy/.test(o.d))&&!(w==='Medium'&&pieces.filter(pc=>pc.weight==='Heavy'&&!['Mount','Enhancement','Buckler','Shield','Tower'].includes(pc.slot)).reduce((a,pc)=>a+(SLOT_UNIT_ALL[pc.slot]||0),0)>=8))out.unshift({d,from:['the whole set']})});
  return out;
}

  c.reward=c.finger===1?'The god\'s Finger relic itself':'A personal relic of your own design, crafted by the god\'s forges from its Apostle signature material; Potency counts as 2 higher than normal';if(c.finger>1)c.sig=2;
  c.rise='The position must be empty, or you defeat its current holder';c.brk='The Rune fragment tears itself out. Constitution save DC '+(10+2*CONTRACTS.indexOf(c)+2)+'; on a failure you drop to 0 hit points. The god\'s whole Hand hunts you'}});

const contractOf=r=>CONTRACTS.find(c=>c.r===(OLD_RANK[r]||r));
// What a rank gives, filled in with one god's own materials and relic when a god is given.
function contractReward(c,g){
  let t=esc(c.reward);if(!g)return t;
  const sig=(g.sig||[]),m=c.sig!=null&&sig[c.sig];
  if(m){const x=findMat(m);t=t.replace(/(Normal|Senior|Apostle) signature material/,`$1 signature material (${x?`<a href="#" data-ref="${ref(x)}">${esc(m)}</a>`:esc(m)})`)}

function contractTable(g){

const CONDITIONS=['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Invisible','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious','Exhaustion','Concentrating'];
const uid=()=>Math.random().toString(36).slice(2,9);

let findBP=n=>BP_IDX.get(lc(n||''));

function addContract(id){const c=PARTY.find(x=>x.id===id),g=$('xc-god').value;if(!c||!g)return;c.extra=(c.extra||[]).concat({god:g,rank:$('xc-rank').value});saveParty();renderParty()}
function rmContract(id,i){const c=PARTY.find(x=>x.id===id);if(!c)return;c.extra.splice(i,1);saveParty();renderParty()}
// Choosing a side: keep one god's contract and break the other, which costs what breaking that rank costs.
function chooseSide(id,keep,drop){const c=PARTY.find(x=>x.id===id);if(!c)return;const all=[{god:c.god,rank:c.rank},...(c.extra||[])];const d=all.find(x=>x.god===drop);if(!d)return;const ct=contractOf(d.rank);
  if(!confirm(`Keep ${keep} and break the contract with ${drop}?\n\n${ct?ct.brk:''}`))return;
  if(c.god===drop){const nx=(c.extra||[]).shift();c.god=nx?nx.god:'';c.rank=nx?nx.rank:''}else c.extra=(c.extra||[]).filter(x=>x.god!==drop);
  c.notes=(c.notes?c.notes+'\n':'')+`Broke the ${d.rank||'Minor'} contract with ${drop} to keep ${keep}: ${ct?ct.brk:''}`;saveParty();renderParty()}
function charStats(c){
  const gear=(c.gear||[]).map(findBP).filter(Boolean);
  const armorAC=gear.filter(b=>ARMOR_CATS.includes(b.cat)).reduce((a,b)=>a+(+b.ac||0),0);
  const otherAC=gear.filter(b=>!ARMOR_CATS.includes(b.cat)).reduce((a,b)=>a+(+b.ac||0),0);
  // every contract the character holds (the main one plus any more); Natural AC doesn't stack, so the highest rank counts
  const contracts=[{god:c.god,rank:c.rank},...(c.extra||[])].map(x=>({g:godByKey(x.god),ct:x.rank?contractOf(x.rank):null})).filter(x=>x.g&&x.ct);
  const ct=contracts.reduce((b,x)=>!b||CONTRACTS.indexOf(x.ct)>CONTRACTS.indexOf(b)?x.ct:b,null);
  // a conflict of interest: two of the character's gods hold the same Rune
  const conflicts=[];contracts.forEach((a,i)=>contracts.slice(i+1).forEach(b=>{const shared=(a.g.runes||[]).filter(r=>(b.g.runes||[]).includes(r));if(shared.length&&a.g!==b.g)conflicts.push({a,b,shared})}));
  const ac=armorAC+otherAC+(+c.acBonus||0)+(ct?ct.ac:0);
  const traits=[];gear.forEach(b=>b.mats.forEach(n=>{const m=findMat(n);if(m&&m.tr&&!traits.some(t=>t.m===m))traits.push({m,b})}));
  const inv=(c.inv||[]).map(([n,q])=>({m:findMat(n),n,q:+q||0}));
  const invGp=inv.reduce((a,x)=>a+(x.m&&x.m.price||0)*x.q,0);
  const purseGp=Object.entries(c.purse||{}).reduce((a,[r,v])=>a+(CURRENCY[r]&&CURRENCY[r].gp||0)*(+v||0),0);

}

// Crafting check, from the vault's Crafting Rules: d20 + profession bonus (half the profession level) vs a DC by rarity.
const CRAFT_DC={Common:10,Uncommon:13,Rare:16,'Very Rare':19,Legendary:22,Artifact:25};
const CRAFT_TIME={Common:'about a day',Uncommon:'about a day',Rare:'about a week','Very Rare':'about a week',Legendary:'a month or more, at the DM\'s discretion, often with a story requirement (a special forge, a season, a witness)',Artifact:'a month or more, at the DM\'s discretion, often with a story requirement (a special forge, a season, a witness)'};
function craftCheck(b,who){
  const st=store.get('craft',{}),dc=CRAFT_DC[b.r]||10,lv=who?+who.profLv||0:null,bonus=lv!=null?Math.floor(lv/2):0;
  const hasProf=who?lc(who.prof||'')===lc(b.pr):null,hasSpec=who&&b.sp&&b.sp!==b.pr?(who.specs||[]).map(lc).includes(lc(b.sp)):true;
  const dis=[];if(who&&!hasSpec&&!(b.lv<=lv/2))dis.push('outside their specialties');if(st.noShop)dis.push('no proper workspace or tools');
  const mt=Math.max(1,...b.mats.map(n=>((REALM[(findMat(n)||{}).realm]||{}).tier||1)));
  const blocked=who?(!hasProf?'They don\'t have the '+b.pr+' profession.':lv<b.lv?`Their ${b.pr} level (${lv}) is below the Blueprint's level (${b.lv}); they can't attempt it.`:stageOf(lv)<mt?`Its materials come from a tier-${mt} realm (${TIER_NAMES(mt)}); working them needs ${b.pr} stage ${mt} (level ${stageStart(mt)}+), and ${esc(who.name||'they')} ${lv?'are at stage '+stageOf(lv):'have no levels'}.`:''):'';
  return {dc,lv,bonus,dis,blocked,mt,time:(CRAFT_TIME[b.r]||'about a day')+(st.noShop?', doubled for working without a proper workspace':'')};
}
function craftCheckHTML(b,who){
  const c=craftCheck(b,who),st=store.get('craft',{});
  return `<div class="callout" style="border-color:var(--gold)"><b>Crafting check</b>: d20 ${who?`+ ${c.bonus} (${esc(who.name||'crafter')}, ${esc(b.pr)} level ${c.lv})`:'+ profession bonus (half the profession level)'} vs <b>DC ${c.dc}</b> (${esc(b.r||'Common')})${c.mt>1?` · needs ${esc(b.pr)} stage ${c.mt} (level ${stageStart(c.mt)}+) for its ${esc(TIER_NAMES(c.mt))} materials`:''}${c.dis.length?` at <b>disadvantage</b> (${esc(c.dis.join('; '))})`:''}. Time: ${esc(c.time)}.
    ${c.blocked?`<div style="color:var(--red);margin-top:4px"><b>Can't craft:</b> ${esc(c.blocked)}</div>`:''}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px"><label class="note" style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="cf-noshop" ${st.noShop?'checked':''}> No proper workspace or tools</label>${!c.blocked?`<button class="btn" id="cf-roll">🎲 Roll the crafting check</button>`:''}<span id="cf-res"></span></div>
    <div class="note" style="margin:6px 0 0">Success: the item is finished and its materials are used. Failure: nothing is lost; try again. Natural 1: the materials are ruined. Natural 20: a maker's flourish.</div></div>`;
}
function craftRoll(){
  const st=store.get('craft',{}),b=findBP(st.bp),who=PARTY.find(c=>c.id===st.who),c=craftCheck(b,who);
  const r1=1+Math.floor(Math.random()*20),r2=1+Math.floor(Math.random()*20),d=c.dis.length?Math.min(r1,r2):r1,tot=d+c.bonus;

function craftRuin(){const st=store.get('craft',{}),b=findBP(st.bp),q=Math.max(1,st.qty||1),c=PARTY.find(x=>x.id===st.who);if(!b||!c)return;c.inv=(c.inv||[]).map(([n,k])=>b.mats.some(x=>lc(x)===lc(n))?[n,Math.max(0,(+k||0)-q)]:[n,k]).filter(([,k])=>k>0);saveParty();toast('Ruined materials removed');craftOut()}
