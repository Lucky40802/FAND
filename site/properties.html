<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root{
  --bg:#0b0a12;--bg2:#0f0e18;--surf:#14131f;--surf2:#1b1a29;--surf3:#242336;
  --line:#2a2840;--line3:#3a3756;
  --text:#ece8f4;--text2:#c6c1d8;--muted:#8a85a6;--muted2:#827d9e;
  --acc:#8b7cf6;--acc2:#c4b5fd;--accbg:rgba(139,124,246,.14);--accbtn:#6a58e0;--sbr:#e06a52;
  --gold:#d9b25a;--gold2:#f2d27e;--goldbg:rgba(217,178,90,.12);
  --red:#ef6b6b;--green:#5fd18b;--blue:#6aaef0;
  --c-common:#9a98a8;--c-uncommon:#5fd18b;--c-rare:#6aaef0;--c-vrare:#b49cff;--c-legend:#f59e52;--c-artifact:#f47171;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:10px;
  --serif:'Palatino Linotype','Book Antiqua',Palatino,'Iowan Old Style',Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f4efe4;--bg2:#efe8da;--surf:#fbf8f1;--surf2:#f3ecdf;--surf3:#e9e0cf;
  --line:#ddd2bd;--line3:#c9bba2;
  --text:#2a2318;--text2:#4a4030;--muted:#675a45;--muted2:#70634b;
  --acc:#6b4fd8;--acc2:#5a3fc4;--accbg:rgba(107,79,216,.1);--accbtn:#6b4fd8;--sbr:#a8402d;
  --gold:#9a6f12;--gold2:#7f5a08;--goldbg:rgba(154,111,18,.1);
  --red:#ad3434;--green:#1f6e42;--blue:#2a65a6;
  --c-common:#68655c;--c-uncommon:#1f6e42;--c-rare:#2a65a6;--c-vrare:#6a44c4;--c-legend:#a2570c;--c-artifact:#ad3434;
  --shadow:0 10px 30px rgba(60,40,10,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--acc);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none;transition:top .15s}.skip:focus{top:12px}
#content:focus{outline:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:.01em}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--acc);background-clip:padding-box}

/* ── Top bar ────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--acc) 70%,transparent);opacity:.45}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;text-align:left}
.brand-mark{width:30px;height:30px;flex-shrink:0}
.brand h1{font-size:1.25rem;letter-spacing:.22em;line-height:1;background:linear-gradient(100deg,var(--acc2),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.08em;margin-top:3px;font-family:var(--serif);font-style:italic}
.search-btn{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:.86rem;text-align:left}
.search-btn:hover{border-color:var(--acc)}
.search-btn span{flex:1}
kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surf2)}
/* Combat tracker on phones: each combatant is a card (name and remove, HP and AC, damage, conditions) */
@media (max-width:700px){
  .cbt thead{display:none}
  .cbt tbody tr:not(.cb-empty){display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"init name x" "hp hp ac" "dmg dmg dmg" "cond cond cond";gap:8px 10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
  .cbt tbody tr:not(.cb-empty) td{display:block;padding:0;border:0;min-width:0!important}
  .cbt td:nth-child(1){grid-area:init}.cbt td:nth-child(2){grid-area:name;font-size:1.02rem}.cbt td:nth-child(3){grid-area:ac}
  .cbt td:nth-child(4){grid-area:hp}.cbt td:nth-child(5){grid-area:dmg;display:flex!important;gap:6px}.cbt td:nth-child(6){grid-area:cond}.cbt td:nth-child(7){grid-area:x;text-align:right}
  .cbt td:nth-child(5) input{flex:1;width:auto!important;min-width:0;font-size:16px;padding:8px!important}
  .cbt td:nth-child(5) .btn{padding:8px 14px}
  .cbt td[data-l]{display:flex!important;align-items:center;gap:6px}
  .cbt td[data-l]::before{content:attr(data-l);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .cbt td[data-l] input{font-size:16px}
}
.pv{position:fixed;inset:0;z-index:85;background:var(--bg);overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
.pv[hidden]{display:none}
.pv-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:10px}
.pv-row.on{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 2px var(--gold) inset}
.pv-row.down{opacity:.45}
.patpad{width:240px;max-width:100%;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.patpad svg{width:100%;height:auto;display:block;cursor:pointer}
.patpad .pd{fill:var(--surf3);stroke:var(--line3);stroke-width:2;transition:fill .1s}
.patpad .pd.on{fill:var(--gold);stroke:var(--gold2)}
.patpad .pl polyline,.patpad .pl line{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.patpad.bad .pd.on,.patpad.bad .pl *{fill:var(--red);stroke:var(--red)}
.patpad.good .pd{stroke:var(--green)}
.pinpad{width:240px;max-width:100%;margin:0 auto}
.pin-dots{display:flex;gap:10px;justify-content:center;min-height:22px;margin:4px 0 12px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line3);display:block}
.pin-dots i.on{background:var(--gold);border-color:var(--gold)}
.pinpad.bad .pin-dots i{border-color:var(--red)}.pinpad.good .pin-dots i{border-color:var(--green)}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-keys button{height:56px;border-radius:50%;width:56px;justify-self:center;background:var(--surf2);border:1px solid var(--line);color:var(--text);font:600 1.35rem var(--sans);cursor:pointer;touch-action:manipulation}
.pin-keys button:active{background:var(--goldbg);border-color:var(--gold)}
.pin-keys .ok{background:var(--gold);color:#000;border-color:var(--gold)}
.top .backbtn{display:none}
@media (display-mode: standalone){.top .backbtn{display:grid}}
html.standalone .top .backbtn{display:grid}
.icon-btn{background:var(--surf);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--text2);flex-shrink:0}
.icon-btn:hover{border-color:var(--acc);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.acct-btn{width:auto;padding:0 12px;gap:6px;display:flex;align-items:center;border-color:var(--gold,#c9a54a);color:var(--text);font:inherit;font-size:.84rem;font-weight:600}
.acct-btn.on{width:36px;padding:0;justify-content:center;border-color:var(--line);position:relative}
.acct-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--goldbg,rgba(201,165,74,.18));color:var(--gold,#c9a54a);font-weight:700;font-size:.85rem}
.acct-av img{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-grid;place-items:center;vertical-align:middle;overflow:hidden}
.av-i{background:var(--goldbg,rgba(201,165,74,.18));color:var(--gold,#c9a54a);font-weight:700;line-height:1}
.acctpop{width:300px;padding:6px}
.acctpop .ap-h{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acctpop .ap-h b{display:block;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctpop .ap-h small{display:block;font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.acctpop .ap-i{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:none;border:0;color:var(--text2);font:inherit;font-size:.9rem;text-align:left;cursor:pointer}
.acctpop .ap-i:hover,.acctpop .ap-i:focus-visible{background:var(--accbg);color:var(--text);outline:none}
.acctpop .ap-i svg{width:16px;height:16px;flex-shrink:0;opacity:.8}
.acctpop .ap-i small{margin-left:auto;font-size:.74rem;color:var(--muted)}
.acctpop .ap-sep{height:1px;background:var(--line);margin:4px 6px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.pf-tile{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;background:var(--surf2,var(--surf));cursor:pointer;display:grid;place-items:center;overflow:hidden;color:var(--text2);font:inherit;font-size:.7rem;text-align:center;line-height:1.2}
.pf-tile img{width:100%;height:100%;object-fit:cover;display:block}
.pf-tile:hover{border-color:var(--line3)}
.pf-tile.on{border-color:var(--gold,#c9a54a);box-shadow:0 0 0 3px var(--goldbg,rgba(201,165,74,.25))}
.pf-tile.up{border:2px dashed var(--line3);background:none}
.acct-btn[data-sync]::after{content:'';position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg2)}
.acct-btn[data-sync="saving"]::after{background:var(--gold);animation:syncPulse 1s ease-in-out infinite}
.acct-btn[data-sync="offline"]::after{background:var(--muted2)}
.acct-btn[data-sync="err"]::after{background:var(--red,#d55)}
@keyframes syncPulse{50%{opacity:.35}}
.acct-btn.err::after{content:'';position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--red,#d55)}
@media (max-width:900px){.acct-btn .acct-l{display:none}.acct-btn{width:36px;padding:0;justify-content:center}}
.acct-btn[hidden]{display:none}

/* ── Tabs ───────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 9px;font-size:.84rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.navg{position:relative}
.navg>.tab .car{font-size:.65rem;opacity:.7;margin-left:2px}
.navpop{position:fixed;z-index:48;min-width:260px;max-width:min(92vw,380px);max-height:calc(100vh - var(--navtop,120px) - 12px);max-height:calc(100dvh - var(--navtop,120px) - 12px);overflow-y:auto;overscroll-behavior:contain;background:var(--surf);border:1px solid var(--line3);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;animation:pop .12s ease-out}
.navpop.open{display:block}
.navpop a{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--text2)}
.navpop a:hover,.navpop a.on{background:var(--accbg);color:var(--text)}
.navpop a b{font-weight:600;color:var(--text)}
.navpop a small{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.navpop a .n{margin-left:auto;font-size:.7rem;color:var(--muted2)}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.tab .n{font-size:.68rem;color:var(--muted2);font-variant-numeric:tabular-nums}
.tab.on .n{color:var(--gold)}

/* ── Workspace ──────────────────────────────────────────────── */
.ws{flex:1;display:flex;min-height:0}
.sb{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 20px}
.sb[hidden]{display:none}
.sb-h{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);padding:8px 16px 6px;font-weight:600}
.sb-i{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-left:2px solid transparent;padding:6px 14px;font-size:.84rem;color:var(--text2);text-align:left}
.sb-i:hover{background:var(--surf);color:var(--text)}
.sb-i.on{border-left-color:var(--gold);background:var(--goldbg);color:var(--text)}
.sb-i.sub{padding-left:30px;font-size:.79rem;color:var(--muted)}
.sb-i.sub.on{color:var(--text)}
.sb-i .c{margin-left:auto;font-size:.7rem;color:var(--muted2);font-variant-numeric:tabular-nums}
.sb-i .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-sep{height:1px;background:var(--line);margin:6px 14px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0}
.ctrl[hidden]{display:none}
.field{position:relative;flex:1 1 240px;min-width:180px}
.field svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.field input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 32px;font-size:.88rem;outline:none}
.field input:focus{border-color:var(--acc)}
.field .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:1rem;padding:2px 6px;display:none}
.field.has .clear{display:block}
select.sel,.btn{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;color:var(--text2);outline:none;max-width:220px}
input.sel,textarea.sel{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;color:var(--text);outline:none;font-family:inherit}
input.sel::placeholder,textarea.sel::placeholder{color:var(--muted)}
input.sel:hover,input.sel:focus,textarea.sel:focus{border-color:var(--acc)}
/* native controls (number spinners, search clear, date pickers) follow FAND's theme, not the device's */
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
select.sel:hover,.btn:hover{border-color:var(--acc)}
select.sel.is-set{border-color:var(--gold);color:var(--text)}
.btn.on{border-color:var(--gold);color:var(--gold2);background:var(--goldbg)}
.btn.primary{background:var(--accbtn,var(--acc));border-color:var(--accbtn,var(--acc));color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.count{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters-btn{display:none}
.content{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth}
.chips-active{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chips-active:empty{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--goldbg);border:1px solid var(--gold);color:var(--text);border-radius:20px;padding:2px 4px 2px 10px;font-size:.75rem}
.achip button{background:none;border:0;color:var(--muted);padding:0 5px;font-size:.9rem}

/* ── Cards ──────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,box-shadow .15s;overflow:hidden;min-width:0}
.card:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:var(--shadow)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--strip,transparent)}
.card .t{display:flex;align-items:flex-start;gap:8px}
.card .nm{font-family:var(--serif);font-weight:700;font-size:1rem;line-height:1.25;color:var(--text);flex:1;min-width:0;overflow-wrap:anywhere}
/* creature, god, and demon pictures (game-icons.net): always on a dark plate, so pale tints read in light mode too */
.art{display:inline-grid;place-items:center;flex-shrink:0;width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ac) 34%,#17131f) 0,#0d0b13 72%);border:1px solid color-mix(in srgb,var(--ac) 45%,#2a2638);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 2px 6px rgba(0,0,0,.25)}
.art svg{width:76%;height:76%;fill:var(--ac);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 45%,transparent)) drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.art.lg{width:116px;height:116px;border-radius:18px}.art.xs{width:30px;height:30px;border-radius:8px;vertical-align:middle;margin-right:8px}.art.xs svg{filter:none}
.mh-row{display:flex;gap:16px;align-items:center}.mh-row>.mh-txt{flex:1;min-width:0}
/* symbols (game-icons) that stand in for emoji in the text, and mark each page in the menu and its heading */
.sym{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;line-height:1;flex-shrink:0}.sym svg{display:block;width:100%;height:100%;fill:currentColor}
.navpop a .sym{width:22px;height:22px;align-self:center;color:var(--gold2);opacity:.9}.navpop a.on .sym,.navpop a:hover .sym{opacity:1}
.tab .sym{width:16px;height:16px;vertical-align:0;opacity:.75}.tab.on .sym,.tab:hover .sym{opacity:1;color:var(--gold2)}
.sym.pgsym{width:1.05em;height:1.05em;margin-right:.35em;vertical-align:-.14em;color:var(--gold2)}
.sec-h h3:has(.pgsym){white-space:nowrap}
/* combat: turn-order strip, quick card, condition symbols */
.cbstrip{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;margin-top:12px;scrollbar-width:thin}
.cbtile{position:relative;flex:0 0 auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;color:var(--text);font:inherit;transition:transform .15s,box-shadow .15s}
.cbtile b{font-size:.72rem;font-weight:600;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.page{max-width:1180px;margin:0 auto}

.page.forge{position:relative;isolation:isolate;--bg:#100705;--bg2:#160a07;--surf:rgba(30,15,10,.86);--surf2:rgba(44,22,14,.9);--surf3:rgba(58,30,18,.92);--tbl:#1e0f0a;--tbl2:#2c160e;--line:#4b2a1b;--line3:#6a3c25;

  --red:#ff6b5a;--green:#7fd98f;--blue:#7cb8f0;color:var(--text);padding:0 4px 30px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.form label.full{grid-column:1/-1}
.form input,.form select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--text);outline:none;width:100%}
.form input:focus,.form select:focus{border-color:var(--acc)}
.form .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.86rem;color:var(--text2)}
.form .chk input{width:auto}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.out .big{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--gold2);line-height:1.1;font-variant-numeric:tabular-nums}
.out .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.84rem;margin-top:6px}
.out .kv span:nth-child(odd){color:var(--muted)}

.note{font-size:.75rem;color:var(--muted);margin-top:8px;line-height:1.5}
.bar{height:6px;border-radius:6px;background:var(--surf3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
svg.curve{width:100%;height:auto;margin-top:10px;display:block}
.enc{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.enc-row{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.enc-row .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.enc-row .h button{background:none;border:0;font-family:var(--serif);font-weight:700;font-size:.98rem;color:var(--text);padding:0;text-align:left}
.enc-row .h button:hover{color:var(--acc2)}

/* ── Modal ──────────────────────────────────────────────────── */
.scav-pop{position:fixed;inset:0;z-index:70;background:rgba(5,4,10,.7);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.scav-win{width:100%;max-width:860px;max-height:92vh;overflow-y:auto;border-radius:14px;box-shadow:var(--shadow);background:var(--bg)}.scav-win>.panel{margin:0}
@media(max-width:640px){.scav-pop{padding:0}.scav-win{max-height:100vh;border-radius:0;min-height:100vh}}
body:has(.scav-pop) .mbg{z-index:72}/* an item opened from a window (level-up, scavenging) shows above it */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(5,4,10,.7);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.mbg.open{display:flex}
.modal{position:relative;width:100%;max-width:760px;background:var(--surf);border:1px solid var(--line3);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.mh{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,var(--surf2),var(--surf))}
.mh::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--strip,linear-gradient(90deg,var(--acc),var(--gold)))}
.mh .kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.mh h2{font-size:1.55rem;line-height:1.2;padding-right:150px;overflow-wrap:anywhere}
.mh .ep{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:2px}
.mh .badges{margin-top:10px}
.mact{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.champ-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}.champ-pick label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--gold2)}
.qa{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.qa-give{display:flex;gap:6px;align-items:center}.qa-give .sel{width:auto;max-width:180px}
.mact .icon-btn{width:32px;height:32px}
.mact .icon-btn.on{color:var(--gold);border-color:var(--gold)}
.mb{padding:16px 22px 22px;display:flex;flex-direction:column;gap:16px}
.kvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kvg>div{padding:8px 11px;display:flex;flex-direction:column;gap:1px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kvg span{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kvg b{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.prose{font-family:var(--serif);font-size:1rem;line-height:1.7;color:var(--text2)}
.prose.lost{font-family:var(--sans);font-size:.85rem;color:var(--muted);border:1px dashed var(--line3);border-radius:8px;padding:10px 12px}
.blk h4{font-family:var(--sans);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.blk h4 em{font-style:normal;color:var(--muted2);letter-spacing:.04em;text-transform:none;font-size:.75rem}
.callout{background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--text2)}
.callout b{color:var(--gold2)}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mlist button{display:flex;gap:10px;align-items:center;background:var(--surf);border:0;border-bottom:1px solid var(--line);padding:7px 11px;text-align:left;font-size:.85rem;color:var(--text2)}
.mlist button:last-child{border-bottom:0}
.mlist button:hover{background:var(--surf2);color:var(--text)}
.mlist button{flex-wrap:wrap;min-width:0}.mlist button>*{min-width:0;overflow-wrap:anywhere}
.cw-info{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--acc);text-decoration:underline;cursor:pointer}
.mc{position:relative;flex:1;min-width:0}.mc-list{position:absolute;left:0;right:0;top:100%;z-index:30;max-height:300px;overflow:auto;background:var(--surf);border:1px solid var(--line3,var(--line));border-radius:8px;box-shadow:var(--shadow);margin-top:4px}
.mc-opt{display:flex;gap:8px;justify-content:space-between;align-items:baseline;padding:7px 10px;cursor:pointer;font-size:.86rem;color:var(--text)}.mc-opt small{color:var(--muted);white-space:nowrap}.mc-opt:hover,.mc-opt.on{background:var(--accbg)}
.mc-h{padding:7px 10px 3px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.mc-more{padding:6px 10px;font-size:.78rem;color:var(--muted)}
.sp-info{display:inline-block;margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;font-size:.75rem;color:var(--acc);font-weight:600;cursor:pointer;white-space:nowrap}.sp-info:hover{border-color:var(--acc)}
.sp-does{border:2px solid var(--acc);border-radius:12px;padding:14px 16px;margin:0 0 14px;background:var(--surf2)}.sp-does h4{margin:0 0 8px;font-family:var(--serif);font-size:1.2rem;color:var(--acc)}.sp-does .prose{font-size:1.02rem;line-height:1.6;margin:0}
.mlist .r{margin-left:auto;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mlist .x{font-size:.75rem;color:var(--muted)}
details.fold summary{cursor:pointer;font-size:.8rem;color:var(--acc2);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:'▸ '}
details.fold[open] summary::before{content:'▾ '}
details.fold>div{margin-top:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.vcard{background:var(--surf2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:.78rem}
.vcard b{display:block;color:var(--text);font-size:.82rem}
.vcard .bn{font-family:var(--mono);color:var(--gold2);font-size:.75rem}
.vcard.mine{border-color:var(--gold)}
.mnav{display:flex;justify-content:space-between;gap:8px;padding:10px 22px;border-top:1px solid var(--line);background:var(--surf2)}
.mnav .btn{font-size:.78rem}
.mnav .pos{font-size:.75rem;color:var(--muted);align-self:center}

/* ── Command palette ────────────────────────────────────────── */
.pal{width:100%;max-width:640px;background:var(--surf);border:1px solid var(--line3);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.pal-in input{flex:1;background:none;border:0;outline:none;font-size:1.02rem}
.pal-res{max-height:60vh;overflow-y:auto;padding:6px 0}
.pal-hint{padding:8px 14px;font-size:.8rem;color:var(--muted)}.pal-hint code{background:var(--surf2);padding:1px 5px;border-radius:4px;font-size:.78rem}
.pal-g{font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);padding:8px 16px 4px;font-weight:600}
.pal-i{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:7px 16px;text-align:left;font-size:.9rem;color:var(--text2)}
.pal-i.sel{background:var(--accbg);color:var(--text)}
.pal-i .r{margin-left:auto;font-size:.72rem;color:var(--muted);white-space:nowrap}
.pal-i mark{background:none;color:var(--gold2);font-weight:700}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surf3);border:1px solid var(--line3);color:var(--text);padding:8px 14px;border-radius:8px;font-size:.84rem;opacity:0;transition:all .2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center;padding:8px 10px 8px 14px}
.toast button{background:none;border:0;color:var(--gold2);font-weight:700;padding:4px 6px;border-radius:6px}
.toast button:hover{background:var(--goldbg)}
.upd{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surf3);border:1px solid var(--gold,#c9a54a);color:var(--text);padding:10px 16px;border-radius:10px;font:inherit;font-size:.86rem;z-index:81;cursor:pointer;max-width:calc(100% - 32px)}
.upd[hidden]{display:none}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width:900px){
  .sb{position:fixed;z-index:40;top:0;bottom:0;left:0;width:280px;box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .2s}

}
@media (max-width:640px){
  body{font-size:14px}
  .top{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .search-btn span,.search-btn kbd{display:none}

  .content{padding:12px}

  .mh h2{padding-right:0;padding-top:34px;font-size:1.3rem}.art.lg{width:84px;height:84px;border-radius:14px}.mh-row{align-items:flex-end}.mh .kind{padding-right:130px;min-height:28px}

}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.4);display:none}
.scrim.on{display:block}
/* stat block */

:root[data-theme="light"] .sblk .sbn{color:#7a1f12}
.sblk .sbt{font-style:italic;color:var(--text2);margin-bottom:6px}

.sblk p{margin:0 0 6px;color:var(--text2)}

@media (max-width:640px){.ai-fab span{display:none}.ai-fab{padding:12px 14px}}
@media print{.sheet.blank .sh-spells .sh-ul{min-height:96px;background:repeating-linear-gradient(transparent 0 23px,#bbb 23px 24px)}}
@media print{.ai,.ai-fab{display:none!important}.sheet.blank button,.sheet.blank .keyrow,.sheet.blank .note,.sheet.blank datalist{display:none!important}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
