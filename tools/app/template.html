<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>FAND · Fantasy and Numerous Disasters</title>
<meta name="description" content="FAND (Fantasy and Numerous Disasters) campaign compendium: Blueprints, materials, monsters, realms, gods, spells, rules, and table tools for the world of Vestige.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l4 10 10 4-10 4-4 10-4-10-10-4 10-4z' fill='%23c9a54a'/%3E%3C/svg%3E">

<script>
// Before anything is drawn: the saved theme, text size, contrast, and motion (so a page never flashes the wrong look)
try{var d=document.documentElement,g=function(k){var v=localStorage.getItem('fand.'+k);return v==null?null:JSON.parse(v)},t=g('theme');d.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');var z=+g('tscale');if(z>=.8&&z<=1.6)d.style.setProperty('--ts',z);if(g('contrast'))d.dataset.contrast='high';if(g('motion')==='reduce')d.dataset.motion='reduce'}catch(e){}
</script>
</head>
<body>
<a class="skip" href="#content" onclick="event.preventDefault();const c=document.getElementById('content');c.setAttribute('tabindex','-1');c.focus()">Skip to the page</a>

<header class="top">
  <button class="icon-btn backbtn" onclick="appBack()" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="brand" onclick="go('home')" aria-label="FAND home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#d9b25a"/></linearGradient></defs><path d="M16 1.5l4.2 10.3L30.5 16l-10.3 4.2L16 30.5l-4.2-10.3L1.5 16l10.3-4.2z" fill="none" stroke="url(#bg1)" stroke-width="1.6"/><path d="M16 9l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="url(#bg1)"/></svg>
    <div><h1>FAND</h1><small>Fantasy and Numerous Disasters</small></div>
  </button>
  <button class="search-btn" onclick="openPalette()" aria-label="Search everything">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Search everything…</span><kbd>Ctrl K</kbd>
  </button>
  <button class="icon-btn hdr-x" onclick="openQuick()" aria-label="Quick rules" title="Quick rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 12h5"/></svg></button>
  <button class="icon-btn hdr-x" id="installBtn" hidden onclick="installApp()" aria-label="Install FAND as an app" title="Install FAND as an app on this computer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  <button class="icon-btn" id="undoBtn" onclick="undoDo()" aria-label="Undo" title="Nothing to undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="icon-btn ib-btn" id="inboxBtn" hidden onclick="inboxToggle()" aria-label="Inbox" aria-haspopup="dialog" aria-expanded="false" title="Inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="ib-n" id="inboxN" hidden></span></button>
  <button class="icon-btn" id="dmPadBtn" hidden onclick="dmPad()" aria-label="DM notepad" title="DM notepad (Alt+N)" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
  <button class="icon-btn hdr-x" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle light or dark theme" title="Toggle theme"></button>
  <button class="icon-btn acct-btn" id="acctBtn" hidden onclick="clAcctClick(this)" aria-haspopup="menu" aria-expanded="false" aria-label="Sign in" title="Sign in"></button>
  <button class="icon-btn hdr-x" onclick="go('settings')" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="icon-btn hdr-more" id="hdrMore" onclick="hdrMore()" aria-label="More: quick rules, theme, settings" aria-haspopup="menu" aria-expanded="false" title="More"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</header>

<aside class="dmpad" id="dmpad" hidden role="dialog" aria-label="DM notepad"></aside>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="navpop" id="navpop" role="menu"></div>
<div class="navpop acctpop" id="acctpop" role="menu" aria-label="Your account"></div>
<div class="navpop ib-pop" id="inboxpop" role="dialog" aria-label="Inbox"></div>

<div class="ws">
  <aside class="sb" id="sb" hidden aria-label="Filters"></aside>
  <div class="scrim" id="scrim" onclick="toggleDrawer(false)"></div>
  <main class="main">
    <div class="ctrl" id="ctrl" hidden></div>
    <div class="page-art" id="pageArt" aria-hidden="true"><canvas id="pa-fx"></canvas></div>
    <div class="content" id="content"><div class="loading">Loading the compendium…<div class="boot"><i id="bootbar"></i></div><small class="boot-s" id="boots"></small><div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
  </main>
</div>

<nav class="bnav" id="bnav" aria-label="Quick navigation"></nav>
<div class="mdrawer" id="mdrawer" role="dialog" aria-modal="true" aria-label="Menu" hidden></div>
<div class="mbg" id="mbg" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal" id="modal"></div>
</div>
<div class="mbg" id="pbg" role="dialog" aria-modal="true" aria-label="Search">
  <div class="pal">
    <div class="pal-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="pq" placeholder="Search blueprints, materials, monsters, gods, spells…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="pal-res" id="pres"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<button class="upd" id="upd" hidden onclick="forceUpdate()">A new version of FAND is ready. Tap to load it.</button>
<button class="upd" id="cloudupd" hidden onclick="location.reload()">Newer data from your account is ready. Tap to load it.</button>
<button class="ai-fab" id="aiFab" onclick="toggleAI(true)" aria-label="Ask the FAND assistant">✦ <span>Ask FAND</span></button>
<aside class="ai" id="ai" aria-label="FAND assistant">
  <div class="ai-h"><h3>FAND Assistant<small>Answers from this compendium · Claude Opus 5.5</small></h3>
    <button class="icon-btn" onclick="newChat()" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="icon-btn" onclick="toggleAI(false)" title="Close" aria-label="Close assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ai-msgs" id="aiMsgs"></div>
  <form class="ai-in" id="aiForm"><textarea id="aiQ" rows="1" placeholder="Ask about Blueprints, materials, monsters, gods, rules…" aria-label="Your question"></textarea><button class="btn primary" id="aiSend" type="submit">Send</button></form>
</aside>
<div id="pv" class="pv" hidden></div>
<div class="mbg" id="qbg" role="dialog" aria-modal="true" aria-labelledby="qTitle">
  <div class="set" id="qBox" style="max-width:640px"></div>
</div>
